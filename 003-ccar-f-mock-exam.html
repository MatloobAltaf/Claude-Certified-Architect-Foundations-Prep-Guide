<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAR-F Hard Mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EAEEF5; --ink:#171C26; --muted:#5E6777; --line:#D6DCE6;
  --accent:#234C8A; --accent-ink:#FFFFFF; --accent-soft:#E3EBF8; --accent-line:#9FB8DF;
  --flag:#B8761B; --flag-soft:#FBEFD9; --good:#2A7A4B; --good-soft:#DFF2E6; --bad:#B23B3B; --bad-soft:#F8E1E1;
  --shadow:0 1px 2px rgba(23,28,38,.06),0 8px 24px -12px rgba(23,28,38,.18);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F131A; --surface:#171D27; --surface-2:#1F2734; --ink:#E6EAF1; --muted:#97A1B3; --line:#2B3443;
    --accent:#8CB4EE; --accent-ink:#0F131A; --accent-soft:#1C2A40; --accent-line:#3A5581;
    --flag:#E0A44A; --flag-soft:#3A2E17; --good:#5CC48A; --good-soft:#173124; --bad:#EF8A8A; --bad-soft:#3B1E1E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F131A; --surface:#171D27; --surface-2:#1F2734; --ink:#E6EAF1; --muted:#97A1B3; --line:#2B3443;
  --accent:#8CB4EE; --accent-ink:#0F131A; --accent-soft:#1C2A40; --accent-line:#3A5581;
  --flag:#E0A44A; --flag-soft:#3A2E17; --good:#5CC48A; --good-soft:#173124; --bad:#EF8A8A; --bad-soft:#3B1E1E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.92em}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.accent{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip.flag{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.chip.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.hidden{display:none!important}

/* ---------- start screen ---------- */
.start{display:grid;gap:24px;max-width:860px;margin:0 auto}
.masthead{display:grid;gap:10px;padding-block:12px 4px}
.masthead h1{font-size:clamp(1.9rem,4vw,2.8rem)}
.masthead .lede{color:var(--muted);max-width:62ch;font-size:1.05rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fact{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.fact .v{font-family:var(--serif);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.fact .k{font-size:.8rem;color:var(--muted)}
.section{padding:20px 22px;display:grid;gap:12px}
.section h2{font-size:1.25rem}
.blueprint{display:grid;gap:8px}
.bp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;font-size:.95rem}
.bp-row .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;grid-column:1/-1}
.bp-row .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bp-row .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.rules{display:grid;gap:8px;color:var(--ink);font-size:.97rem}
.rules li{margin:0}
.rules ul{margin:0;padding-left:20px;display:grid;gap:6px}
.history{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:.95rem}
.hrow .score{font-family:var(--serif);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:3.2ch}
.hrow .meta{color:var(--muted);font-size:.85rem}
.start-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.note{font-size:.88rem;color:var(--muted)}

/* ---------- exam screen ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .title{font-family:var(--serif);font-weight:600;font-size:1.05rem}
.topbar .grow{flex:1 1 auto}
.timer{font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.progress{height:4px;background:var(--surface-2)}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.qcol{display:grid;gap:16px;min-width:0}
.scn{padding:16px 20px;display:grid;gap:10px;border-left:4px solid var(--accent)}
.scn summary{cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600;list-style:none}
.scn summary::-webkit-details-marker{display:none}
.scn summary .name{font-family:var(--serif);font-size:1.15rem}
.scn .body{display:grid;gap:10px;padding-top:8px;font-size:.95rem}
.scn .tools{margin:0;padding-left:0;list-style:none;display:grid;gap:4px}
.scn .tools li{padding-left:14px;text-indent:-14px}
.scn .tools code{background:var(--surface-2);padding:1px 5px;border-radius:4px}
.qcard{padding:22px 24px;display:grid;gap:18px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead .num{font-family:var(--serif);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.stem{font-size:1.06rem;line-height:1.55;max-width:72ch}
.stem code{background:var(--surface-2);padding:1px 5px;border-radius:4px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);line-height:1.45}
.opt:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.opt .key{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.85rem;color:var(--muted);flex:none}
.opt.multi .key{border-radius:6px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qnav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.qnav .left,.qnav .right{display:flex;gap:10px;flex-wrap:wrap}
.btn.flagged{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);display:grid;gap:12px}
.rail .card{padding:14px 16px;display:grid;gap:12px}
.rail h3{font-size:1rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}
.legend i.a{background:var(--accent);border-color:var(--accent)}
.legend i.f{background:var(--flag-soft);border-color:var(--flag)}
.legend i.c{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pal button{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:.85rem;font-weight:600;color:var(--muted);display:grid;place-items:center;position:relative}
.pal button.a{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pal button.f::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.pal button.f{border-color:var(--flag)}
.pal button.c{box-shadow:inset 0 0 0 2px var(--accent)}
.pal .sep{grid-column:1/-1;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--surface-2);border-radius:8px;padding:8px 4px}
.stats b{display:block;font-family:var(--serif);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:.75rem}
.confirm{display:grid;gap:10px;padding:14px 16px;border:1px solid var(--bad);border-radius:10px;background:var(--bad-soft);font-size:.95rem}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.railtoggle{display:none}
@media (max-width:900px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto;transform:translateY(100%);transition:transform .2s;box-shadow:0 -8px 24px -12px rgba(0,0,0,.4)}
  .rail.open{transform:none}
  .rail .card{box-shadow:none;border:0;padding:0}
  .railtoggle{display:inline-flex}
  .pal{grid-template-columns:repeat(10,1fr)}
  .qcard{padding:16px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

/* ---------- results screen ---------- */
.results{display:grid;gap:20px}
.scorecard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;padding:24px 26px;align-items:center}
.scorecard .big{font-family:var(--serif);font-size:clamp(3rem,8vw,4.6rem);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.scorecard .big small{font-size:.35em;color:var(--muted);font-weight:500}
.scorecard .verdict{display:grid;gap:8px}
.scorecard .verdict h2{font-size:1.5rem}
.verdict .row{display:flex;gap:8px;flex-wrap:wrap}
.pf{font-family:var(--serif);font-size:1.25rem;font-weight:600}
.pf.pass{color:var(--good)} .pf.fail{color:var(--bad)}
.domains{padding:20px 22px;display:grid;gap:14px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:.95rem}
.drow .bar{grid-column:1/-1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.drow .bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.drow .bar i.weak{background:var(--bad)}
.drow .bar i.mid{background:var(--flag)}
.drow .bar i.strong{background:var(--good)}
.drow .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem;white-space:nowrap}
.tasks{padding:20px 22px;display:grid;gap:10px}
.ttable{width:100%;border-collapse:collapse;font-size:.92rem}
.ttable th,.ttable td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ttable th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ttable td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tscroll{overflow-x:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rev{display:grid;gap:12px}
.ritem{padding:18px 20px;display:grid;gap:12px}
.ritem .head{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ritem .head .num{font-family:var(--serif);font-weight:600;font-size:1.15rem}
.ritem .stem{font-size:1rem}
.ropts{display:grid;gap:8px}
.ropt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;line-height:1.45}
.ropt .key{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:.8rem;color:var(--muted);flex:none}
.ropt.correct{border-color:var(--good);background:var(--good-soft)}
.ropt.correct .key{background:var(--good);border-color:var(--good);color:#fff}
.ropt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ropt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.ropt.missed{border-color:var(--good);border-style:dashed}
.ropt .why{display:block;color:var(--muted);font-size:.88rem;margin-top:4px}
.expl{padding:12px 14px;border-radius:8px;background:var(--surface-2);font-size:.95rem;display:grid;gap:6px}
.expl b{font-family:var(--serif)}
.results-actions{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:640px){ .scorecard{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>


<div id="app"></div>

<script>
const BANK = [{"scenario":{"id":"A","name":"Kestrel Mobility support agent","kind":"Customer Support Resolution Agent","brief":"Kestrel Mobility runs a subscription e-bike and scooter share across three cities. You are the architect for its support agent, which handles ride-charge disputes, subscription pauses, damaged-vehicle reports and account lockouts. The agent is built on the Claude API with a custom tool-execution layer and Agent SDK hooks.","tools":["identify_rider(phone_or_email, verification_code) → verified rider_id, or a verification failure","list_recent_trips(rider_id) → last 20 trips (40+ fields each)","get_trip(trip_id) → one trip","refund_trip(trip_id, amount, reason)","pause_subscription(rider_id, weeks)","file_damage_report(vehicle_id, description)","unlock_account(rider_id)","escalate_to_human(summary)"],"constraints":"Targets: 80% first-contact resolution. Policy: refunds above $40 need human approval; account unlocks require verified identity; vehicles flagged under_investigation must not receive agent-filed damage reports."},"questions":[{"task":"1.1","domain":1,"type":"single","stem":"The first version of the agent loop was written by a contractor. It sends the request, then: exits if the assistant text contains the word \"Resolved\"; exits if the response has no text block; otherwise executes any tool calls and continues, up to a hard cap of 8 iterations. In production the agent sometimes stops mid-refund, and sometimes keeps going after it has clearly finished. Which single change fixes the loop's control flow?","options":{"A":"Continue only while stop_reason is \"tool_use\": execute every tool_use block, append a user message containing the tool_result blocks, and exit when stop_reason is \"end_turn\". Remove the text checks and the iteration cap.","B":"Keep the structure but raise the cap to 25 iterations and add a check for stop_reason \"max_tokens\" so long refunds are not cut off.","C":"Replace the word check with a stricter signal: require the assistant's final text to contain a JSON object with status: \"done\".","D":"Add a finish_case tool and terminate the loop as soon as the model calls it, ignoring stop_reason entirely."},"answer":["A"],"explanation":"The loop must be driven by stop_reason, not by natural-language signals or arbitrary caps. \"tool_use\" means execute and return results; \"end_turn\" means the model is finished. Every other option keeps at least one anti-pattern the blueprint names explicitly.","rationale":{"A":"Correct. This is the canonical agentic loop: stop_reason drives continuation, tool results go back as tool_result blocks, and there are no text-parsing or cap-based exits.","B":"Raising the cap keeps the arbitrary-cap anti-pattern; it just fails later. The text-based exits that stop refunds mid-flight are untouched.","C":"A JSON marker in assistant text is still parsing natural-language output for completion. The model may omit it, produce it early, or produce it alongside a tool call.","D":"A termination tool replaces one heuristic with another and still ignores the signal the API actually provides. If the model answers with text and ends its turn without calling finish_case, the loop never exits."}},{"task":"1.1","domain":1,"type":"multi","select":3,"stem":"A reviewer is checking how the loop returns tool results to Claude after an iteration in which the model emitted three tool_use blocks (get_trip twice and pause_subscription once), one of which failed with a gateway timeout. Which THREE statements describe correct handling?","options":{"A":"Each tool_result block must carry the tool_use_id of the tool_use block it answers.","B":"The results are sent back in a single user-role message that contains a tool_result block for every tool_use block, including the one that failed (reported as an error result).","C":"The results should be appended as an assistant-role message so that the model treats them as its own reasoning.","D":"Because one call failed, the loop should return results only for the two successful calls and let the model notice the missing one.","E":"Before appending, the loop may trim each get_trip result to the handful of fields relevant to the case; the trimmed result is what the model reasons over."},"answer":["A","B","E"],"explanation":"Tool results are returned as tool_result content blocks in the next user message, one per tool_use block and each keyed by tool_use_id. Failures are returned too, as error results. Trimming verbose results before they enter context is encouraged, not forbidden.","rationale":{"A":"Correct. tool_use_id is how the API pairs a result with the call that produced it.","B":"Correct. All tool_use blocks in a response must be answered in the following user message; a failed call is answered with an error result, not omitted.","C":"Wrong. Tool results belong in a user-role message. Appending them as assistant content breaks the request structure.","D":"Wrong. Omitting a result for an emitted tool_use block is an invalid request; the failure should be returned as a structured error result.","E":"Correct. Trimming a 40-field trip record to the relevant fields is exactly the context hygiene Domain 5 recommends, and it happens before the result is appended."}},{"task":"1.4","domain":1,"type":"single","stem":"The system prompt states in bold: \"Never call refund_trip for more than $40. Above $40 you must escalate_to_human first.\" A quarterly audit finds that 3% of refunds above $40 were processed with no escalation. The prompt already has two few-shot examples of correct escalation. Which change gives the guarantee the finance team is asking for?","options":{"A":"Enforce the rule in the tool-execution layer (or a PreToolUse hook): reject any refund_trip call with amount > 40 unless an approval token returned by escalate_to_human is present, and return a structured error to the model explaining what to do instead.","B":"Move the rule to the very top of the system prompt, restate it in the refund_trip description, and add three more few-shot examples of correct escalation.","C":"Set temperature to 0 so the model's behaviour on the rule becomes deterministic.","D":"Keep the prompt as is and add a nightly reconciliation job that reverses any refund above $40 that lacks an approval record."},"answer":["A"],"explanation":"When a business rule must hold every time, prompt instructions have a non-zero failure rate no matter how they are phrased. A programmatic gate on the tool call is the only option that makes the violation impossible rather than less likely.","rationale":{"A":"Correct. Programmatic enforcement blocks the downstream call until the prerequisite (an approval) exists, and the structured error lets the model recover gracefully.","B":"Better prompting lowers the rate but cannot make it zero; the audit asked for a guarantee.","C":"Temperature 0 does not make instruction-following deterministic across varied conversations; the 3% will move, not vanish.","D":"Reversing money after the fact is a pragmatic patch, not prevention. The rider still sees a refund appear and disappear, and the policy is still being violated."}},{"task":"1.4","domain":1,"type":"single","stem":"The team already added a gate: unlock_account is blocked until identify_rider has been called in the session. A fraud review still finds accounts unlocked for the wrong person. In the failing transcripts, identify_rider returned a verification failure (or a rider_id for a different person after a name-based lookup), yet unlock_account then ran successfully with a rider_id the model had read earlier in the conversation. What is the flaw in the gate?","options":{"A":"It checks that the prerequisite tool was called, not what it returned. The gate must validate the value flowing between steps: unlock_account may run only when identify_rider returned a verified rider_id and the rider_id argument equals that verified value.","B":"identify_rider is not being forced early enough; the first request of every session should use tool_choice to force identify_rider before any other tool.","C":"The gate is invisible to the model; the rule should be moved into the system prompt so the model understands why the sequence matters.","D":"unlock_account should accept a phone number instead of a rider_id so the model cannot pass a fabricated identifier."},"answer":["A"],"explanation":"Call-order gates are necessary but not sufficient. Inter-step validation means checking the output of the prerequisite step and binding the downstream call's arguments to it, so the model cannot substitute a stale or mismatched value.","rationale":{"A":"Correct. The prerequisite is a verified identity, not a function invocation; the gate must check the returned status and the identifier match.","B":"Forcing the call earlier changes timing, not correctness. A forced identify_rider can still fail verification, and unlock_account could still run with a different rider_id.","C":"Prompt guidance is probabilistic; the failures happened despite a deterministic gate, so weakening it to a prompt makes things worse.","D":"Changing the identifier type moves the problem: a phone number typed from the conversation is just as unverified as a rider_id."}},{"task":"1.4","domain":1,"type":"single","stem":"A rider reports being charged twice for the same 18-minute ride and, in the same message, asks to pause the subscription for three weeks while travelling. The agent confirms two charges of $23.40 on separate trip IDs that share a start time, but the total to refund exceeds the agent's limit. Which handoff to the human queue best follows the blueprint's escalation pattern?","options":{"A":"A structured summary: verified rider_id, both trip IDs with amounts and timestamps, what was verified, the likely root cause (duplicate authorization at ride end), actions already taken, the recommended action (refund the duplicate), and the still-open pause request with its dates.","B":"The full conversation transcript attached to the ticket, so the human agent has every detail and nothing is lost in summarization.","C":"A one-line note (\"double charge, needs refund\") plus the rider's callback number, to keep the handoff token-cheap.","D":"The agent's self-reported confidence score and a sentiment label, so the queue can prioritize the case."},"answer":["A"],"explanation":"The blueprint's handoff protocol carries customer details, root cause analysis and recommended actions in structured form, and multi-concern requests are decomposed into distinct items so nothing (here, the pause) is dropped.","rationale":{"A":"Correct. It is structured, preserves the transactional facts, states root cause and recommendation, and keeps the second concern visible.","B":"A raw transcript pushes the analysis work back onto the human and buries the key numbers; it is not a handoff protocol.","C":"Too little: it drops the trip IDs, amounts, verification status and the pause request entirely.","D":"Confidence and sentiment are unreliable proxies for complexity and contain none of the case facts a human needs."}},{"task":"1.5","domain":1,"type":"single","stem":"get_trip and list_recent_trips come from a legacy MCP server that returns Unix epoch timestamps and numeric status codes (1 = active, 2 = completed, 3 = cancelled). refund_trip and pause_subscription come from a newer server that returns ISO 8601 strings and named statuses. Transcripts show the model comparing an epoch value against an ISO string and treating a status of 3 as \"completed\" before issuing a refund. What is the most reliable fix?","options":{"A":"Register a PostToolUse hook that normalizes every tool result to a single convention (ISO 8601 timestamps, named status strings) before the model sees it.","B":"Add a status-code legend and timestamp-conversion instructions to the system prompt so the model can translate the legacy formats itself.","C":"Register a PreToolUse hook that rewrites the arguments of refund_trip so they match whatever format the legacy server uses.","D":"Ask the owners of the legacy server to migrate to ISO 8601 and named statuses, and pause the refund flow until they do."},"answer":["A"],"explanation":"Heterogeneous formats from different MCP tools are exactly what PostToolUse hooks are for: transform the result deterministically before the model reasons about it, rather than asking the model to translate on every turn.","rationale":{"A":"Correct. Normalization in a hook is deterministic, applies to every call, and removes the translation burden from the model.","B":"Prompt-based translation is probabilistic; the comparison error will recur at some rate. It also costs tokens on every turn.","C":"The problem is inbound results, not outbound arguments. Rewriting arguments does nothing about the epoch-vs-ISO comparison.","D":"It may be worth doing eventually, but it blocks the product on another team; the hook fixes it now with no dependency."}},{"task":"1.5","domain":1,"type":"single","stem":"Safety policy: when a vehicle is flagged under_investigation, damage reports must go to the safety team, not through file_damage_report. Vehicle flags live in a fleet database the model cannot query directly. Which design guarantees compliance while still letting the agent help the rider?","options":{"A":"A PreToolUse hook on file_damage_report that looks up the vehicle flag, blocks the call for flagged vehicles, and returns a structured message telling the model to use escalate_to_human with a safety-team routing note.","B":"Add a sentence to file_damage_report's description: \"Do not use for vehicles under investigation; escalate instead.\"","C":"Remove file_damage_report from the agent's tool set entirely so no report can ever be filed for a flagged vehicle.","D":"A PostToolUse hook that deletes any report filed for a flagged vehicle and notifies the safety team afterwards."},"answer":["A"],"explanation":"Interception of the outgoing call is the deterministic mechanism; the redirect keeps the workflow useful. The model cannot see the flag, so a description-based rule cannot even be followed reliably.","rationale":{"A":"Correct. The hook enforces the rule with data the model lacks, and the redirect turns a block into an alternative path.","B":"The model has no access to the flag, so the instruction is unenforceable; and descriptions guide selection probabilistically anyway.","C":"Removing the tool breaks damage reporting for the 99% of unflagged vehicles.","D":"The report has already been filed and could trigger downstream workflows; cleanup after the fact is not compliance."}},{"task":"2.1","domain":2,"type":"single","stem":"Both trip tools have clear descriptions and distinct parameter types (get_trip takes trip_id; list_recent_trips takes rider_id). Yet even when a rider pastes an exact trip ID, the agent first calls list_recent_trips and occasionally picks a neighbouring trip from the list. The system prompt contains: \"Whenever a rider mentions a charge, always review their recent trips before responding.\" What is the best fix?","options":{"A":"Rewrite the system-prompt instruction that ties the word \"charge\" to reviewing recent trips, and state in get_trip's description that it is the tool to use whenever a trip ID is supplied.","B":"Merge the two tools into get_trips(rider_id?, trip_id?) so there is only one tool to choose.","C":"Add a routing layer that regex-matches trip IDs in the user message and forces get_trip with tool_choice when one is found.","D":"Add six few-shot examples to the system prompt in which the agent calls get_trip when a trip ID is present."},"answer":["A"],"explanation":"The blueprint calls out keyword-sensitive system-prompt wording as a cause of unintended tool associations. The descriptions are not the problem here; the instruction is.","rationale":{"A":"Correct. It removes the instruction that created the association and makes the description state the decisive condition.","B":"Merging creates a single ambiguous tool with optional parameters, the opposite of clear boundaries.","C":"A regex router works around the model instead of fixing the cause, and it will miss IDs described in words or with typos.","D":"Few-shots may partly counteract the instruction, but the instruction still pulls the other way on every turn; fix the cause first."}},{"task":"2.2","domain":2,"type":"multi","select":2,"stem":"refund_trip currently returns the string \"Operation failed\" for three very different situations: the payment gateway timed out, the rider has an open chargeback (refund not allowed by policy), and the requested amount exceeds the remaining trip charge. The agent retries chargeback cases three times and then tells riders to \"try again later\". Which TWO changes to the tool's response would let the agent recover appropriately?","options":{"A":"Return structured metadata on every failure: an errorCategory (transient, validation, business, permission), an isRetryable boolean, and a human-readable explanation the agent can relay.","B":"Set the MCP isError flag on failure responses so the agent recognizes the result as a failure rather than parsing it as data.","C":"Have the tool retry every failure internally with exponential backoff before returning anything to the agent.","D":"Keep the generic message for the agent but log the detailed cause server-side for the operations team.","E":"Raise a protocol-level exception so the failure surfaces to the client application instead of the agent."},"answer":["A","B"],"explanation":"Uniform errors hide the information the agent needs to decide between retrying, explaining a policy, or fixing its input. Structured metadata plus the isError flag give it that information in a form it can act on.","rationale":{"A":"Correct. Category and retryability separate the gateway timeout (retry) from the chargeback (explain, do not retry) and the amount error (fix input).","B":"Correct. isError is the MCP pattern for signalling failure; without it the agent may read the string as an ordinary payload.","C":"Blanket internal retries waste time on validation and business errors that can never succeed, and still return nothing useful.","D":"Server-side logs do not help the agent choose a recovery path in the conversation.","E":"Crashing out to the client removes the agent's chance to recover or explain; it is the workflow-termination anti-pattern."}},{"task":"2.3","domain":2,"type":"single","stem":"Product wants every conversation to begin with a call to classify_intent (returns one of refund, pause, damage, lockout, other) so routing metrics are reliable. After that first call the agent should be free to answer with plain text when no tool is needed. Which tool_choice configuration achieves this?","options":{"A":"On the first request only, tool_choice: {\"type\": \"tool\", \"name\": \"classify_intent\"}; on all later requests, tool_choice: \"auto\".","B":"tool_choice: \"any\" on every request, with a system-prompt instruction to call classify_intent first.","C":"tool_choice: \"auto\" on every request, with a system-prompt instruction that classify_intent must be the first call.","D":"tool_choice: {\"type\": \"tool\", \"name\": \"classify_intent\"} on every request so classification is always current."},"answer":["A"],"explanation":"Forced tool selection guarantees a specific tool is called; \"auto\" lets the model answer with text. Mixing them per request gives the guarantee where it is needed and freedom afterwards.","rationale":{"A":"Correct. Forced selection on turn one, \"auto\" afterwards.","B":"\"any\" guarantees some tool is called on every turn, so the agent can never reply with plain text, and it does not guarantee which tool runs first.","C":"\"auto\" allows the model to skip the classification call; the requirement was a guarantee.","D":"Forcing classify_intent on every request means the agent can never call any other tool or answer in text."}},{"task":"5.1","domain":5,"type":"single","stem":"In a long dispute conversation the rider says early on: \"I was charged $23.40 on the 14th and I expect the whole amount back.\" Thirty turns later, after many list_recent_trips results (each 40+ fields per trip), the agent quotes $19.90, offers a partial refund, and refers to \"the 12th\". The team's current mitigation is to summarize the conversation every ten turns and keep only the summary. What should the architect change?","options":{"A":"Extract transactional facts (amounts, dates, trip IDs, statuses and the rider's stated expectation) into a persistent case-facts block included in every request, and trim tool results to the fields the case needs.","B":"Summarize more often (every five turns) so the summary stays closer to the original statements.","C":"Increase max_tokens and switch to a model with a larger context window so nothing needs to be summarized.","D":"Move the full transcript into the system prompt on each request so it sits at the start of the context, where recall is strongest."},"answer":["A"],"explanation":"Progressive summarization is what turns exact figures into vague ones. Persisting the facts verbatim in a dedicated block, and cutting the 40-field tool noise, addresses both the loss and the dilution.","rationale":{"A":"Correct. This is the case-facts pattern plus tool-output trimming from Task 5.1.","B":"More frequent summarization compounds the problem: each pass is another chance to blur numbers and dates.","C":"A bigger window still leaves the facts buried in the middle of thousands of irrelevant fields; lost-in-the-middle is not solved by more middle.","D":"Duplicating the whole transcript in the system prompt doubles token use and still does not isolate the facts from the noise."}},{"task":"5.2","domain":5,"type":"single","stem":"First-contact resolution is 62% against an 80% target. A review of 200 escalations finds: 40% were riders using profanity about a simple, in-policy refund; and 15 cases were \"resolved\" autonomously when policy did not cover the situation (rides ended by a city-wide geofence outage) by inventing a rule. Which change addresses both failure modes?","options":{"A":"Add \"Do not escalate solely because a rider is upset\" to the system prompt.","B":"Have the agent rate each case's complexity from 1 to 5 and escalate anything rated 4 or higher.","C":"Escalate whenever a negative-sentiment classifier crosses a threshold, and handle everything else autonomously.","D":"Add explicit escalation criteria to the system prompt with few-shot examples: acknowledge frustration and resolve when the fix is in policy; escalate when policy is silent or ambiguous, or when the rider asks for a human."},"answer":["D"],"explanation":"The root cause is unclear decision boundaries in both directions. Explicit criteria with examples cover under-escalation on policy gaps and over-escalation on tone.","rationale":{"A":"Addresses only the tone-driven escalations; the invented-policy cases continue.","B":"Self-reported complexity is an unreliable proxy; the agent that invents a policy will also rate the case as simple.","C":"Sentiment-based escalation is the very behaviour producing the 40% of unnecessary escalations.","D":"Correct. Criteria plus demonstrations of both cases fix the boundary itself."}},{"task":"5.2","domain":5,"type":"single","stem":"A rider writes: \"Unlock my account, I'm the Sam Reyes who rode yesterday.\" identify_rider by name returns three riders named Sam Reyes; one has a trip yesterday. Which behaviour should the system prompt specify?","options":{"A":"Ask the rider for an additional identifier (the phone number or email on the account, and the verification code) before proceeding.","B":"Proceed with the Sam Reyes who has a trip yesterday, since the rider volunteered that detail.","C":"Proceed with the Sam Reyes whose home city matches the rider's current IP location.","D":"Escalate immediately, because identity cannot be established from the information given."},"answer":["A"],"explanation":"Multiple matches require clarification with additional identifiers, not heuristic selection. Escalation is unnecessary because the agent can still make progress by asking.","rationale":{"A":"Correct. Clarify with identifiers that verify, rather than choosing on a hint anyone could have guessed.","B":"A public detail (\"I rode yesterday\") is not verification; this is heuristic selection and enables account takeover.","C":"IP geolocation is another heuristic; it is neither verification nor policy.","D":"Escalating is premature: the agent has a straightforward path (ask for identifiers) and escalation lowers first-contact resolution."}}]},{"scenario":{"id":"B","name":"Meridian Policy Lab research pipeline","kind":"Multi-Agent Research System","brief":"Meridian Policy Lab produces cited regulatory briefs for public-sector clients (for example, \"municipal rules for sidewalk delivery robots across 12 jurisdictions\"). The pipeline is built on the Claude Agent SDK: a coordinator agent delegates to specialized subagents and assembles a brief that must carry claim-level citations and flag contested findings.","tools":["reg_search — searches statutes, regulator sites and municipal codes","lit_search — searches academic and think-tank publications","doc_analyst — reads full documents and extracts findings","synthesizer — writes the brief from the collected findings"],"constraints":"Briefs must attribute every claim to a source, include publication dates, and separate well-established findings from contested ones. Runs can take 30 to 40 minutes and cost real money when they fail."},"questions":[{"task":"1.2","domain":1,"type":"single","stem":"To cut latency, an engineer let lit_search hand documents straight to doc_analyst and let doc_analyst send extracted findings straight to synthesizer, bypassing the coordinator. Since then: the same PDF is analyzed two or three times, doc_analyst timeouts vanish without a trace, and the coordinator cannot say which subagent produced a given finding. What is the architectural correction?","options":{"A":"Return to hub-and-spoke: every subagent reports back to the coordinator, which routes information, de-duplicates work and handles errors centrally.","B":"Keep the direct links but add a shared message bus so every subagent can see every other subagent's traffic.","C":"Merge lit_search and doc_analyst into one subagent so the hand-off between them disappears.","D":"Keep the direct links and have each subagent append its findings to a shared scratchpad file the coordinator reads at the end."},"answer":["A"],"explanation":"The coordinator is the single point of observability, routing and error handling. Direct subagent-to-subagent communication is what removed all three properties.","rationale":{"A":"Correct. Hub-and-spoke restores routing, de-duplication and consistent error handling in one place.","B":"A bus adds visibility but not control; duplication and unhandled errors remain because nobody is responsible for them.","C":"Merging tools into one over-broad subagent trades one problem for degraded tool selection and loses the specialization benefit.","D":"A shared file is an audit log, not coordination. Errors that never reach the coordinator still vanish, and the duplicated analysis still happens."}},{"task":"1.2","domain":1,"type":"single","stem":"A brief on delivery-robot rules came back with a solid draft but no data after 2024 for four of the twelve jurisdictions, and the client noticed. Which loop should the coordinator run before returning a brief?","options":{"A":"Evaluate the synthesizer's draft against the stated research goals, identify gaps (missing jurisdictions, stale dates, unsupported claims), and re-delegate targeted queries to reg_search and doc_analyst, then re-synthesize.","B":"Instruct the synthesizer to \"be comprehensive and cover all twelve jurisdictions\" and regenerate the draft.","C":"Run the whole pipeline twice with different random seeds and merge the two drafts.","D":"Double the number of reg_search subagents spawned at the start so more material is collected before synthesis."},"answer":["A"],"explanation":"Iterative refinement means the coordinator inspects synthesis output for gaps and re-delegates targeted work. The other options either cannot add missing data or add cost without targeting the gap.","rationale":{"A":"Correct. This is the refinement loop described in Task 1.2.","B":"The synthesizer has no new sources; a stronger instruction only tempts it to fill gaps from parametric knowledge.","C":"Running twice doubles cost and has no mechanism to find the specific jurisdictions that were missed.","D":"More upfront searching is untargeted; the gap is discovered only after synthesis, which is where the loop must start."}},{"task":"1.2","domain":1,"type":"multi","select":2,"stem":"The coordinator invokes all four subagents in a fixed order for every request. A simple request (\"What is the current compliance deadline in the EU AI Act for high-risk systems?\") takes nine minutes, and for broad requests reg_search and lit_search return 30% overlapping documents. Which TWO changes address these problems?","options":{"A":"Have the coordinator analyze the request and dynamically select which subagents to invoke, skipping lit_search when scholarly sources are not needed.","B":"Partition scope explicitly in each delegation (by jurisdiction, source type or time window) so subagents do not retrieve the same documents.","C":"Hard-code a keyword decision tree (\"deadline\" → reg_search only; \"impact\" → all four) in the coordinator's code.","D":"Give every subagent all tools so any single subagent can complete a simple request on its own.","E":"Cap every subagent at three tool calls so simple requests finish quickly."},"answer":["A","B"],"explanation":"Dynamic subagent selection and explicit scope partitioning are the two coordinator responsibilities the blueprint names for this situation. Keyword trees and call caps are the pre-configured-decision-tree and arbitrary-cap anti-patterns.","rationale":{"A":"Correct. Model-driven selection of subagents based on the request is what a coordinator is for.","B":"Correct. Partitioning minimizes duplication across subagents.","C":"A keyword tree replaces model reasoning with a brittle pre-configured sequence.","D":"Over-provisioning tools degrades selection reliability and destroys specialization.","E":"An arbitrary cap truncates complex research and does nothing about duplication."}},{"task":"1.3","domain":1,"type":"single","stem":"The synthesizer's briefs refer to \"the research findings\" in general terms and omit the figures doc_analyst extracted. The coordinator's delegation prompt to the synthesizer reads, in full: \"Synthesize the findings from the previous agents into a brief.\" What is wrong?","options":{"A":"Subagents do not inherit the coordinator's conversation; the prompt must include the complete findings from prior subagents, ideally in a structured format that separates content from metadata such as source and date.","B":"The synthesizer should be launched with the coordinator's session ID so it resumes the same context.","C":"Shared memory between subagents should be enabled in the AgentDefinition so findings propagate automatically.","D":"The synthesizer should be given the doc_analyst tool so it can re-derive the findings itself."},"answer":["A"],"explanation":"Subagent context is isolated and must be provided explicitly in the prompt. There is no automatic inheritance or shared memory to switch on.","rationale":{"A":"Correct. Pass the actual findings, structured, into the subagent prompt.","B":"Subagents are separate invocations, not resumptions of the parent session; and resuming the coordinator's session would be the wrong context anyway.","C":"No such automatic sharing exists; context passing is the coordinator's job.","D":"Re-running analysis in the synthesizer duplicates work and violates tool scoping for a writing agent."}},{"task":"1.3","domain":1,"type":"single","stem":"Traces show that for a 12-jurisdiction brief the coordinator spawns twelve reg_search subagents one after another: it emits one Task call, waits for the result, then emits the next. The subtasks are independent. Which change produces real parallelism?","options":{"A":"Instruct the coordinator to emit all independent Task tool calls in a single response so they run concurrently.","B":"Raise the coordinator's max_turns so it has enough turns to get through all twelve subtasks.","C":"Use fork_session to create twelve copies of the coordinator, one per jurisdiction.","D":"Run twelve separate coordinator processes and merge their outputs with a script."},"answer":["A"],"explanation":"Parallel subagents come from multiple Task calls in one coordinator response, not from more turns or more coordinators.","rationale":{"A":"Correct. Multiple tool_use blocks in one assistant response run in parallel.","B":"More turns keeps the same sequential pattern; it just allows it to finish.","C":"fork_session is for exploring divergent approaches from a shared baseline, not for fanning out independent work items.","D":"Twelve coordinators lose the single point of aggregation and error handling."}},{"task":"1.3","domain":1,"type":"single","stem":"A new coordinator is configured with allowedTools: [\"Read\", \"WebSearch\"] and an agents map defining reg_search, lit_search, doc_analyst and synthesizer with descriptions and system prompts. When run, it replies \"I will research this myself\" and never delegates. What is the most likely cause?","options":{"A":"\"Task\" is missing from the coordinator's allowedTools, so it cannot spawn subagents.","B":"The coordinator's system prompt does not mention the word \"delegate\".","C":"The permission mode should be set to bypass permissions so subagent spawning is not blocked.","D":"The subagent definitions must be described inside the coordinator's system prompt for it to know they exist."},"answer":["A"],"explanation":"Spawning subagents goes through the Task tool; a coordinator whose tool list omits it has no way to delegate, however well the subagents are defined.","rationale":{"A":"Correct. allowedTools must include \"Task\".","B":"Prompt wording can encourage delegation but cannot create a capability that the tool list withholds.","C":"Permission mode governs approvals for allowed tools; it does not add tools.","D":"The agents map already exposes the definitions; what is missing is the mechanism to invoke them."}},{"task":"1.6","domain":1,"type":"single","stem":"Meridian handles two kinds of request. Type 1: \"Summarize rule X\" (well understood, always the same four steps). Type 2: \"Map how rule X interacts with state and municipal law\", where the relevant subtasks (which states, which preemption clauses) are unknown until the first search returns. The current fixed chain (reg_search → lit_search → doc_analyst → synthesizer) is wasteful for Type 1 and shallow for Type 2. What should the architect do?","options":{"A":"Keep a fixed prompt-chained pipeline for Type 1, and use adaptive decomposition for Type 2, where the coordinator generates follow-up subtasks (for example, one analysis per preempting state) based on what earlier steps discover.","B":"Use a longer fixed chain for everything, adding a state-law step and a municipal-law step so Type 2 is covered.","C":"Use adaptive decomposition for everything, since it is strictly more capable than a fixed chain.","D":"Ask the client to specify the subtasks in the request so the coordinator never has to decide."},"answer":["A"],"explanation":"Fixed sequential pipelines suit well-understood workflows; adaptive decomposition suits tasks whose subtasks depend on intermediate findings. Matching the pattern to the request type is the skill being tested.","rationale":{"A":"Correct. Each request type gets the decomposition strategy that fits it.","B":"A longer fixed chain still cannot know which states matter until the search returns, and it makes Type 1 even more wasteful.","C":"Adaptive planning adds cost and variance to requests that do not need it; predictability is a virtue for Type 1.","D":"Pushing decomposition onto the client removes the value of the system and does not survive the first unexpected finding."}},{"task":"2.3","domain":2,"type":"single","stem":"The synthesizer was given the full tool set (14 tools including web_search and fetch_pdf) \"so it can fill any gaps\". Since then it performs its own searches mid-draft, cites pages that no other agent saw, and occasionally calls fetch_pdf with a search query instead of a URL. Fact-checks during synthesis are frequent, and 85% are simple lookups. What should change?","options":{"A":"Restrict the synthesizer to the tools of its role (read_findings, write_brief) plus one scoped cross-role tool, such as check_citation, for the frequent simple lookups; route complex verification back through the coordinator.","B":"Keep the full tool set and add \"Do not search the web during synthesis\" to its system prompt.","C":"Give the synthesizer even more tools so it never has to route anything through the coordinator.","D":"Set tool_choice: \"none\" for the synthesizer so it can only write."},"answer":["A"],"explanation":"Agents with tools outside their specialization misuse them; scoped access with a single high-frequency cross-role tool is the recommended compromise.","rationale":{"A":"Correct. Least privilege for the role, with a narrow tool for the 85% case.","B":"The tools remain available and the misuse remains possible; the prompt only lowers the frequency.","C":"More tools increases decision complexity and the misuse rate.","D":"The synthesizer still needs write_brief and read_findings; disabling all tools breaks it."}},{"task":"2.2","domain":2,"type":"single","stem":"reg_search returns an empty list both when a regulator's website times out and when a query has no matching documents. Last week the coordinator wrote \"No municipal regulations were found\" for a city whose site had been down. How should reg_search report outcomes?","options":{"A":"Return an explicit success with zero results for a valid empty query, and a structured error for access failures (failure type, query attempted, partial results, suggested alternatives), after attempting a local retry for transient failures.","B":"Have the coordinator retry any empty result up to three times before accepting it as empty.","C":"Treat every empty result as a failure so the coordinator always escalates it.","D":"Raise an exception on timeout so the run stops and an engineer can investigate."},"answer":["A"],"explanation":"Access failures and valid empty results must be distinguishable, and transient failures should get local recovery before propagation.","rationale":{"A":"Correct. It separates the two cases and adds local recovery for the transient one.","B":"Retrying genuine empties wastes calls, and the coordinator still cannot tell which kind of empty it got.","C":"Marking valid empties as failures produces false alarms and hides real ones among them.","D":"Terminating the whole run on a single subagent failure is an anti-pattern."}},{"task":"5.3","domain":5,"type":"single","stem":"lit_search fails permanently for one topic area (a publisher's API is down) while every other subagent succeeds. What should the coordinator have the synthesizer do with the final brief?","options":{"A":"Produce the brief with coverage annotations that state which findings are well supported and which topic areas have gaps because sources could not be retrieved.","B":"Retry lit_search up to three times and, if it still fails, drop that topic area so the brief contains only verified content.","C":"Fill the missing area from the model's background knowledge and label it \"general knowledge\".","D":"Abort the brief and notify the client that the pipeline failed."},"answer":["A"],"explanation":"The blueprint asks for synthesis output structured with coverage annotations; silently dropping an area or aborting are both anti-patterns, and parametric filler undermines the brief's provenance guarantees.","rationale":{"A":"Correct. The client sees exactly what is and is not supported.","B":"Silently omitting an area hides the gap from the reader; retries are fine, the dropping is not.","C":"Uncited model knowledge in a brief that promises claim-level citations is a provenance failure even when labelled.","D":"Terminating the whole workflow over one failed component is the anti-pattern the blueprint warns against."}},{"task":"5.6","domain":5,"type":"single","stem":"A delivered brief says \"studies show a 30 to 45% reduction in sidewalk incidents\" with no citation. doc_analyst had the two source reports, but the coordinator passed the synthesizer a compressed prose summary of doc_analyst's output. Which fix prevents this class of error?","options":{"A":"Require doc_analyst to output structured claim-to-source mappings (source name or URL, excerpt, publication date) and require every downstream agent, including the synthesizer, to preserve and merge those mappings.","B":"Have the synthesizer run a search after drafting to find a citation for each unsupported claim.","C":"Add \"always cite your sources\" to the synthesizer's system prompt.","D":"Increase the length limit of the coordinator's summaries so fewer details are lost."},"answer":["A"],"explanation":"Attribution is lost at summarization when the claim-source mapping is not a first-class structured output. Preserving that structure end to end is the fix; post-hoc citation hunting invents provenance.","rationale":{"A":"Correct. Provenance travels with the claim through every hop.","B":"Searching for a citation after the fact can attach a source that never made the claim.","C":"The synthesizer cannot cite what it was never given.","D":"Longer prose summaries still lose the mapping; structure, not length, is what preserves it."}},{"task":"5.6","domain":5,"type":"single","stem":"Two credible sources report different counts of jurisdictions with delivery-robot rules: 14 (a 2023 industry survey) and 22 (a 2025 regulator report). doc_analyst kept 22 as \"more recent\" and dropped 14. In a different brief, two same-year sources conflicted and doc_analyst picked the one it judged more credible. Which design is correct?","options":{"A":"Require publication or data-collection dates in structured outputs, have doc_analyst include both values annotated with their sources, and let the synthesizer present them in a contested-findings section or explain the temporal difference.","B":"Always keep the most recent figure and discard older ones.","C":"Report the average of conflicting figures with both sources cited.","D":"Exclude any statistic on which credible sources disagree."},"answer":["A"],"explanation":"Conflicts are annotated with attribution rather than resolved by a subagent's heuristic, and dates are required so growth over time is not misread as contradiction.","rationale":{"A":"Correct. It preserves both values, their sources and their dates, and defers reconciliation to the synthesis stage where it can be explained.","B":"Recency is a heuristic; the 2023 figure may be the right one for a 2023 comparison, and same-year conflicts have no \"most recent\".","C":"An average is a number no source ever reported.","D":"Excluding contested findings hides exactly the information the client asked the brief to flag."}},{"task":"5.4","domain":5,"type":"single","stem":"A 40-minute research run crashed during synthesis and had to be rerun from scratch, costing another $18. The coordinator keeps all subagent results only in its own conversation context. Which design makes runs recoverable?","options":{"A":"Have each subagent export its structured state (findings, sources, status) to a known location, and have the coordinator load a manifest on resume and re-run only the steps that are missing.","B":"Raise the coordinator's max_turns so long runs are less likely to be cut off.","C":"Wrap the entire pipeline in a retry loop that restarts it up to three times.","D":"Rely on resuming the coordinator's session, since the subagent outputs are already in its context."},"answer":["A"],"explanation":"Crash recovery is designed with structured state exports and a coordinator manifest, so completed work is not repeated.","rationale":{"A":"Correct. This is the manifest-based recovery pattern from Task 5.4.","B":"The crash was not a turn limit; more turns changes nothing.","C":"Restarting from scratch is what cost $18; a retry loop repeats that cost.","D":"A crash mid-synthesis may leave the session unusable, and context-only state gives no way to know which steps completed; results kept only in context are not durable state."}}]},{"scenario":{"id":"C","name":"Tallgrass Robotics monorepo","kind":"Code Generation, Developer Productivity and CI with Claude Code","brief":"Tallgrass Robotics maintains a monorepo with four packages: firmware/ (C++), fleet-ops/ (a Python service), dashboard/ (TypeScript and React) and infra/ (Terraform). Thirty engineers use Claude Code daily; a three-person platform team owns the shared configuration. CI runs on GitHub Actions and the team wants Claude Code to review pull requests and generate tests there.","tools":["Claude Code built-in tools: Grep, Glob, Read, Write, Edit, Bash, Task (subagents), Explore subagent","MCP servers under evaluation: GitHub, Jira, a local Postgres server","CI: claude CLI invoked from GitHub Actions"],"constraints":"Shared conventions must reach every engineer through version control. Personal experiments must not change teammates' behaviour. CI runs must never wait for input and must produce machine-readable output."},"questions":[{"task":"3.1","domain":3,"type":"single","stem":"A senior engineer's ~/.claude/CLAUDE.md says \"Use the pytest fixtures in fleet-ops/tests/conftest.py; never write unittest-style classes.\" Her sessions comply, but teammates report Claude generating unittest classes. Where should the instruction live so everyone gets it?","options":{"A":"In the project's committed memory: the repository CLAUDE.md (or a file under .claude/rules/) so it is version-controlled and loaded for every engineer.","B":"In a CLAUDE.local.md at the repository root, committed alongside CLAUDE.md.","C":"In .claude/settings.json under an \"instructions\" key so it is applied by the shared settings file.","D":"Keep it in her ~/.claude/CLAUDE.md and reference it from the project CLAUDE.md with @~/.claude/CLAUDE.md."},"answer":["A"],"explanation":"User-level memory applies only to that user and is never shared through version control. Team conventions belong in project memory.","rationale":{"A":"Correct. Project CLAUDE.md and .claude/rules/ travel with the repository.","B":"CLAUDE.local.md is the personal, git-ignored variant; committing it defeats its purpose and it is still not the shared file.","C":"settings.json holds permissions and configuration, not memory instructions; there is no such key.","D":"An @import of a home-directory path resolves to each engineer's own file, which the teammates do not have."}},{"task":"3.1","domain":3,"type":"single","stem":"The root CLAUDE.md has grown to 1,400 lines covering all four packages. Firmware engineers complain about React conventions in their context, and the coding-standards documents in docs/standards/ are also consumed by other tooling, so they must stay single-sourced. How should the platform team restructure?","options":{"A":"Give each package its own CLAUDE.md that @imports only the relevant standards files (for example, firmware/CLAUDE.md contains @docs/standards/cpp.md), and reduce the root CLAUDE.md to repository-wide basics.","B":"Copy the relevant sections of docs/standards/ into each package's CLAUDE.md so each package is self-contained.","C":"Move all of docs/standards/*.md into .claude/rules/ without paths frontmatter so Claude loads them as rules.","D":"Keep the single root CLAUDE.md but add a table of contents so Claude can find the relevant section."},"answer":["A"],"explanation":"@import keeps CLAUDE.md modular while leaving the standards files single-sourced; directory-level CLAUDE.md files scope them to the package.","rationale":{"A":"Correct. Selective @imports per package, single source of truth preserved.","B":"Copies drift from the source documents and double the maintenance.","C":"Rules without paths frontmatter load for everyone all the time, which is the original problem in a new place.","D":"A table of contents does not reduce the context loaded; every line is still read."}},{"task":"3.2","domain":3,"type":"single","stem":"The team's /perf-profile skill runs a profiler and returns roughly 30,000 tokens of raw output. After invoking it, engineers find the main conversation loses track of earlier decisions. Which frontmatter change in SKILL.md addresses this directly?","options":{"A":"context: fork, so the skill runs in an isolated subagent context and only its summary returns to the main conversation.","B":"allowed-tools: Bash, Read, so the skill cannot produce output through other tools.","C":"argument-hint: <binary>, so engineers pass the target explicitly and the profiler runs less often.","D":"Move the skill's body into a slash command in .claude/commands/ so it runs inline."},"answer":["A"],"explanation":"context: fork exists precisely to keep verbose skill output out of the main conversation.","rationale":{"A":"Correct. Isolation of verbose output is the documented purpose of context: fork.","B":"Restricting tools does not reduce the profiler's output size.","C":"argument-hint improves invocation ergonomics; it has no effect on context pollution.","D":"A slash command runs inline in the main context, which is exactly where the output should not go."}},{"task":"3.2","domain":3,"type":"single","stem":"The shared /release-notes skill lives in .claude/skills/release-notes/ and formats notes in the team's standard layout. One engineer wants a variant that also posts a summary to her personal Slack channel, without affecting anyone else. What should she do?","options":{"A":"Create a personal skill under ~/.claude/skills/ with a different name (for example release-notes-slack) that includes the extra step.","B":"Edit the project skill to add an optional \"slack\" argument that defaults to off.","C":"Create ~/.claude/skills/release-notes/ with the same name so her personal version overrides the project one.","D":"Add \"after generating release notes, post a summary to my Slack channel\" to her ~/.claude/CLAUDE.md."},"answer":["A"],"explanation":"Personal variants go in ~/.claude/skills/ under a different name, so the shared skill is untouched and there is no name collision.","rationale":{"A":"Correct. Personal scope, distinct name.","B":"It changes the shared, version-controlled skill for everyone and adds a Slack dependency the team did not ask for.","C":"A same-name personal skill creates a collision with the project skill; the blueprint specifies a different name for personal variants.","D":"A global memory instruction fires in every session, not only when release notes are generated, and cannot carry the skill's steps."}},{"task":"3.3","domain":3,"type":"single","stem":"Terraform conventions must apply to every *.tf file, most of which are in infra/ but some of which live in fleet-ops/deploy/. React test conventions must apply to every *.test.tsx file anywhere. Which configuration is correct?","options":{"A":".claude/rules/terraform.md with frontmatter paths: [\"**/*.tf\"], and .claude/rules/react-tests.md with paths: [\"**/*.test.tsx\"].","B":".claude/rules/terraform.md with frontmatter paths: [\"infra/**/*\"], and .claude/rules/react-tests.md with paths: [\"dashboard/**/*\"].","C":"A CLAUDE.md inside infra/ for Terraform and a CLAUDE.md inside dashboard/ for React tests.","D":"Sections in the root CLAUDE.md headed \"Terraform\" and \"React tests\" that Claude applies when relevant."},"answer":["A"],"explanation":"Glob patterns by file type apply conventions regardless of directory, which directory-scoped patterns and directory CLAUDE.md files cannot do for the fleet-ops/deploy files.","rationale":{"A":"Correct. File-type globs cover both locations.","B":"infra/**/* misses fleet-ops/deploy/*.tf and applies Terraform rules to non-Terraform files in infra/.","C":"Directory CLAUDE.md files are bound to a subtree; the deploy/ Terraform files are outside it.","D":"Always-loaded sections cost tokens on every task and rely on Claude to infer applicability."}},{"task":"3.3","domain":3,"type":"single","stem":"A rule file .claude/rules/python-style.md has no frontmatter. Engineers editing TypeScript in dashboard/ notice Python conventions showing up in Claude's suggestions and their context is larger than expected. What is the minimal correct fix?","options":{"A":"Add YAML frontmatter with paths: [\"**/*.py\"] so the rule loads only when Python files are being edited.","B":"Move the content into the root CLAUDE.md under a \"Python\" heading.","C":"Rename the file to fleet-ops-python.md so Claude associates it with the Python package.","D":"Add context: fork to the rule file so it is evaluated in isolation."},"answer":["A"],"explanation":"Rules without a paths field load unconditionally; adding the glob makes loading conditional and cuts irrelevant context.","rationale":{"A":"Correct. paths frontmatter is the scoping mechanism for rules.","B":"The root CLAUDE.md is loaded for everyone as well; nothing is scoped.","C":"File names carry no scoping semantics.","D":"context: fork is a skill frontmatter option, not a rules option."}},{"task":"3.4","domain":3,"type":"single","stem":"An engineer used plan mode to investigate migrating fleet-ops from Flask to FastAPI (about 60 files, with decisions about dependency injection). Claude produced a plan and the engineer approved it. Still in plan mode, the engineer typed \"Now make the changes\", and nothing was modified. What is the correct next step?","options":{"A":"Exit plan mode and run the approved plan in direct execution; plan mode is for investigation and design and does not modify files.","B":"Stay in plan mode and grant the Edit tool permission so Claude can implement while planning.","C":"Start a fresh session, paste the plan, and ask Claude to implement it from scratch.","D":"Hand the plan to the Explore subagent so it can perform the edits in an isolated context."},"answer":["A"],"explanation":"The intended workflow combines plan mode for investigation with direct execution for implementation; the switch is the step that was missed.","rationale":{"A":"Correct. Investigate in plan mode, implement in direct execution.","B":"Plan mode is read-only by design; granting edit permission is not how implementation happens.","C":"Throws away the investigation context already in the session for no benefit.","D":"The Explore subagent is for read-only discovery, not for making changes."}},{"task":"3.4","domain":3,"type":"single","stem":"Before fixing a telemetry parsing bug, an engineer needs to know every place telemetry frames are parsed across firmware/ and fleet-ops/. The discovery phase produces about 80,000 tokens of Grep and Read output and the session becomes sluggish and forgetful. Which approach preserves the main conversation?","options":{"A":"Delegate the discovery to the Explore subagent, which does the verbose searching in its own context and returns a summary of the parsing locations.","B":"Run /compact after every few searches so the discovery output is condensed as it accumulates.","C":"Switch to plan mode for the discovery so the output is treated as planning context.","D":"Split the search into two sessions, one per package, and combine the notes manually."},"answer":["A"],"explanation":"The Explore subagent exists to isolate verbose discovery output and return summaries, preserving the main context for coordination and implementation.","rationale":{"A":"Correct. Verbose discovery in a subagent, summary in the main context.","B":"Compaction helps at the margin but repeatedly summarizes the very details the fix depends on.","C":"Plan mode changes what Claude may do, not how much of the output enters context.","D":"Two sessions still each carry the full noise, and cross-package relationships are lost between them."}},{"task":"3.5","domain":3,"type":"single","stem":"An engineer asks Claude to convert telemetry CSV rows into the canonical JSON event format and describes the mapping in two paragraphs of prose. Three attempts handle null fields and unit conversion differently each time (one drops nulls, one emits null, one emits empty strings; battery voltage is sometimes converted to volts and sometimes left in millivolts). Which technique should be tried first?","options":{"A":"Provide two or three concrete input/output example pairs, including one with a null field and one with a unit conversion.","B":"Ask Claude to interview the engineer about edge cases before writing any code.","C":"Rewrite the prose specification at greater length with a bulleted list of rules.","D":"Switch to plan mode so Claude designs the converter before implementing it."},"answer":["A"],"explanation":"When prose descriptions of a transformation are interpreted inconsistently, concrete input/output examples are the most effective way to communicate the expected behaviour.","rationale":{"A":"Correct. Examples pin down exactly the cases that varied.","B":"The interview pattern surfaces unknown considerations; here the considerations are known and the problem is inconsistent interpretation.","C":"More prose is more of the thing that is already being misread.","D":"This is a small, well-scoped transformation, not an architectural decision."}},{"task":"3.5","domain":3,"type":"multi","select":2,"stem":"The fleet-ops team is starting a new rebalancing scheduler. Later, a test run produces three failures: a typo in a constant, a missing import, and a retry-logic failure that only occurs in combination with the timeout configuration. Which TWO practices match the blueprint's iterative refinement guidance?","options":{"A":"Before implementation, have Claude interview the engineer to surface considerations such as maintenance windows, time zones and battery thresholds that the engineer may not have anticipated.","B":"Report the retry and timeout failures together in a single message because they interact, while the typo and the import can be handled as independent fixes.","C":"Always report every failure in one message so Claude has the complete picture, regardless of whether they interact.","D":"Ask Claude to make the tests pass without showing it the failure output, so it reasons from the code alone.","E":"Always fix one failure at a time and re-run the suite after each, regardless of whether failures interact."},"answer":["A","B"],"explanation":"The interview pattern is for surfacing unanticipated considerations before implementation; interacting problems go in one message while independent ones can be handled sequentially.","rationale":{"A":"Correct. This is the interview pattern applied where it belongs, before building.","B":"Correct. Interacting issues must be seen together; independent ones need not be.","C":"Batching everything ignores the distinction the blueprint draws and invites entangled fixes for unrelated problems.","D":"Sharing test failures is the mechanism of test-driven iteration; withholding them removes the signal.","E":"Strict one-at-a-time fixing fails for interacting problems, where fixing one in isolation can be wrong."}},{"task":"3.6","domain":3,"type":"single","stem":"The PR review job runs claude -p \"Review this diff for security issues\" and then parses the free-text output with regular expressions to create inline PR comments. Comments land on the wrong lines and the parser breaks whenever the phrasing changes. What is the right fix?","options":{"A":"Add --output-format json together with --json-schema pointing at a findings schema (file, line, severity, message), and post comments from the parsed JSON.","B":"Add \"respond only in JSON\" to the prompt and strip any Markdown fences before parsing.","C":"Use --output-format stream-json and reconstruct the findings from the streamed message events.","D":"Have the job write the review to a file and ask a second claude -p run to convert it to JSON."},"answer":["A"],"explanation":"The CLI's JSON output with a JSON schema is the mechanism for enforcing machine-parseable structure in CI; prompt-only JSON is the same fragile approach in a different form.","rationale":{"A":"Correct. Schema-enforced structured output from the CLI.","B":"A prompt request for JSON is not enforcement; the parser will still break on deviations.","C":"Streaming events are for incremental display, not for guaranteeing a findings schema.","D":"A second free-text-to-JSON pass adds cost and another point of failure without a guarantee."}},{"task":"3.6","domain":3,"type":"multi","select":3,"stem":"The CI pipeline generates unit tests with Claude Code and then, in the same session, asks it to review the tests it just wrote; the review almost never finds problems, and the generated tests ignore the fixture conventions used elsewhere in the repository. When a PR gets new commits, the re-review repeats findings that were already fixed. Which THREE changes follow the blueprint?","options":{"A":"Run the review in a separate session from the one that generated the code, so the reviewer has no memory of the generation reasoning.","B":"When re-running a review after new commits, include the prior review's findings so the reviewer can mark each as resolved or still open.","C":"Keep generation and review in one session but enable extended thinking for the review step.","D":"On each re-review, start from scratch without the prior findings, to avoid biasing the reviewer.","E":"Provide existing test files (and document the fixture conventions in CLAUDE.md) as context during test generation."},"answer":["A","B","E"],"explanation":"Session isolation between generation and review, carrying prior findings into re-reviews, and giving generation the existing tests and CLAUDE.md conventions are the three Task 3.6 practices in play.","rationale":{"A":"Correct. Self-review in the same session retains the reasoning that produced the code.","B":"Correct. Prior findings let the re-review track resolution instead of repeating itself.","C":"Extended thinking does not remove the shared context that makes self-review weak.","D":"Discarding prior findings is what causes the repeated comments.","E":"Correct. Existing tests and documented standards are how generated tests learn the repository's conventions."}},{"task":"2.4","domain":2,"type":"single","stem":"Everyone on the team needs the Jira MCP server, which requires an API token per engineer. One engineer is also experimenting with a local Postgres MCP server that nobody else should get. How should the servers be configured?","options":{"A":"Jira in the project's .mcp.json with the token referenced as ${JIRA_TOKEN}; the Postgres server in the engineer's user-level ~/.claude.json.","B":"Both servers in the project's .mcp.json so the configuration is in one place.","C":"Both servers in each engineer's ~/.claude.json, with the platform team sharing a template file.","D":"Jira in the project's .mcp.json with the token value written inline, since the repository is private."},"answer":["A"],"explanation":"Project-scoped .mcp.json is for shared team tooling with environment-variable expansion for secrets; user-scoped ~/.claude.json is for personal or experimental servers.","rationale":{"A":"Correct. Correct scope for each server, secret kept out of the repository.","B":"Committing the Postgres server gives it to everyone, and there is no way to keep it experimental.","C":"Shared tooling in user scope drifts and is not version-controlled; templates are not con
