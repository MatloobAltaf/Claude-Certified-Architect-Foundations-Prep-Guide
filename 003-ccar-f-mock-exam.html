figuration.","D":"A token committed to a repository is a secret leak regardless of repository visibility."}},{"task":"2.4","domain":2,"type":"multi","select":2,"stem":"Two proposals are on the table. First, write a custom MCP server for GitHub issues and pull requests. Second, fix the fact that the agent makes about a dozen exploratory list and search calls per session just to find out which operational runbooks exist. Which TWO recommendations align with the blueprint?","options":{"A":"Use the existing community GitHub MCP server rather than building a custom one for a standard integration.","B":"Expose the runbook catalog as MCP resources so the agent can browse what exists without exploratory tool calls.","C":"Build the custom server around a single generic do_github(action, params) tool to keep the tool count low.","D":"Paste the full text of every runbook into CLAUDE.md so the agent never needs to look them up.","E":"Register the GitHub server in both .mcp.json and ~/.claude.json so it is available even if one file is misconfigured."},"answer":["A","B"],"explanation":"Prefer community servers for standard integrations, and use MCP resources for content catalogs that would otherwise cost exploratory calls.","rationale":{"A":"Correct. GitHub is a standard integration with a maintained server.","B":"Correct. Resources are the mechanism for exposing catalogs such as runbook lists.","C":"A single generic tool is the ambiguous-boundary anti-pattern from Domain 2.","D":"Full runbook text in CLAUDE.md bloats every session's context; a catalog is what is needed, not the content.","E":"Duplicate registration causes confusion about which configuration is active and does not improve reliability."}},{"task":"2.5","domain":2,"type":"multi","select":2,"stem":"An engineer needs two things: every call site of parse_frame( across the monorepo, including calls made through wrapper modules; and a list of all files whose names end in _frame_test.py. Which TWO tool choices are correct?","options":{"A":"Grep for the pattern parse_frame( to find call sites, then Read the wrapper modules to follow imports and trace the call chain.","B":"Glob for **/*_frame_test.py to list the test files by name pattern.","C":"Glob for the pattern parse_frame( to locate the call sites.","D":"Grep for _frame_test.py to list the files with that name suffix.","E":"Read every file in firmware/ and fleet-ops/ so nothing is missed."},"answer":["A","B"],"explanation":"Grep searches file contents; Glob matches file paths. Tracing usage through wrappers is Grep to find entry points followed by Read to follow imports.","rationale":{"A":"Correct. Content search plus incremental reading.","B":"Correct. Path-pattern matching is Glob's job.","C":"Glob matches paths, not code content.","D":"Grep searches inside files; it would find only files that mention the string, not files named that way.","E":"Reading everything floods the context and is exactly what the search tools avoid."}},{"task":"2.5","domain":2,"type":"single","stem":"Claude tries to change the third occurrence of the line timeout_s = 30 in fleet-ops/scheduler.py to timeout_s = 45. The Edit tool fails because the text matches four locations. Which recovery is appropriate?","options":{"A":"Read the full file, then Write it back with only the intended occurrence changed (or expand the Edit anchor with surrounding unique lines).","B":"Re-run Edit with replace_all set to true so the failure disappears.","C":"Run sed -i 's/timeout_s = 30/timeout_s = 45/' through Bash to bypass the Edit tool.","D":"Retry the identical Edit call; the match is sometimes resolved on a second attempt."},"answer":["A"],"explanation":"When Edit cannot find a unique anchor, Read followed by Write is the reliable fallback; widening the anchor is the other legitimate route. Global replacements change the wrong lines.","rationale":{"A":"Correct. Full-file read and write guarantees only the intended change.","B":"replace_all changes all four occurrences; only one was meant to change.","C":"sed without an anchor also changes all four, and it sidesteps the tool's safety.","D":"The failure is deterministic; retrying the same call fails the same way."}},{"task":"1.7","domain":1,"type":"single","stem":"Yesterday a named session, telemetry-audit, analyzed 30 files in fleet-ops/. Overnight, two things happened on different branches. Branch 1: a small refactor touched 6 of the 30 files. Branch 2: a large restructuring rewrote 25 of the 30 files. For each branch, how should the engineer continue the audit?","options":{"A":"Branch 1: claude --resume telemetry-audit and tell Claude which 6 files changed so it re-reads only those. Branch 2: start a new session seeded with a structured summary of yesterday's findings, since most of the prior tool results are stale.","B":"Resume telemetry-audit on both branches; the session already contains the analysis.","C":"Start a fresh session on both branches with no prior context, to avoid stale results.","D":"Fork telemetry-audit twice with fork_session, once per branch, and continue in each fork."},"answer":["A"],"explanation":"Resume when prior context is mostly valid and inform the session of the specific changes; start fresh with an injected summary when the prior tool results are mostly stale.","rationale":{"A":"Correct. Each branch gets the strategy that matches how much of the context is still valid.","B":"Resuming on Branch 2 reasons over 25 stale file reads.","C":"Branch 1 loses 24 files of still-valid analysis for nothing.","D":"fork_session is for divergent exploration from a shared baseline; the Branch 2 baseline is stale, so forking it inherits the staleness."}},{"task":"1.6","domain":1,"type":"single","stem":"fleet-ops has 140 modules and no automated tests. The platform lead asks Claude Code to \"add comprehensive tests\". Which decomposition should the engineer set up?","options":{"A":"First map the codebase structure and identify high-impact, high-risk areas (entry points, money-handling, scheduling), then generate tests module by module in that priority order, reviewing each batch.","B":"Generate tests for the 140 modules in alphabetical order, one file per session, until finished.","C":"Ask for 100% coverage in a single prompt and let Claude decide how to proceed.","D":"Submit all 140 modules to the Message Batches API overnight with the same test-generation prompt."},"answer":["A"],"explanation":"Open-ended tasks are decomposed by first mapping structure and identifying high-impact areas, then working in priority order.","rationale":{"A":"Correct. Map, prioritize, then execute in slices.","B":"Alphabetical order ignores risk and impact; the most important modules may come last.","C":"One giant prompt for an open-ended task invites shallow, inconsistent output and offers no checkpoint.","D":"Batch may suit nightly generation later, but without the structural map the same prompt cannot know each module's fixtures, dependencies or priority."}},{"task":"4.1","domain":4,"type":"single","stem":"The CI reviewer flags \"missing docstring\" on about 40% of changed functions and \"possible race condition\" on nearly any shared variable. Developers now ignore every comment, including three accurate SQL-injection findings last month. What should the platform team do first?","options":{"A":"Temporarily disable the two high-false-positive categories, then rewrite the review criteria with explicit, categorical definitions and concrete code examples of what to flag and what to skip.","B":"Add \"Be conservative and only report high-confidence findings\" to the review prompt.","C":"Have the reviewer emit a confidence score per finding and post only those above 0.8.","D":"Limit the reviewer to a maximum of three comments per pull request."},"answer":["A"],"explanation":"High false-positive categories destroy trust in accurate ones. Disable them to restore trust, then fix precision with specific criteria; vague conservatism instructions do not improve precision.","rationale":{"A":"Correct. Restore trust immediately, then fix the criteria properly.","B":"General instructions like \"be conservative\" do not change what counts as a finding.","C":"Self-reported confidence is unreliable; noisy categories will still score high.","D":"A cap hides real findings behind noisy ones at random."}}]},{"scenario":{"id":"D","name":"Harborline Logistics document extraction","kind":"Structured Data Extraction","brief":"Harborline Logistics processes about 40,000 shipping documents a month: bills of lading, customs declarations and port invoices from more than 300 carriers, arriving as scanned PDFs, emails and spreadsheets. A Claude API pipeline extracts structured records (shipper, consignee, container IDs, HS codes, incoterms, line items, totals, dates), validates them and loads them into a customs-filing system.","tools":["Extraction tools with JSON schemas: extract_bol, extract_customs, extract_invoice","lookup_hs_code — MCP tool backed by the tariff database","Message Batches API for non-blocking workloads"],"constraints":"A mis-filed HS code triggers customs fines. Some filings have a hard 4-hour deadline after vessel arrival. A human review team can check about 2,000 documents a month."},"questions":[{"task":"4.3","domain":4,"type":"single","stem":"The pipeline asks for JSON in the prompt (\"Respond with a JSON object containing...\"). About 4% of responses include a sentence of commentary before the object or an unbalanced bracket, and each one crashes the loader. What is the most reliable fix?","options":{"A":"Define the extraction as a tool whose input_schema is the record schema, and use tool_choice to make the model call it; read the record from the tool_use input.","B":"Add \"Respond only with JSON and no other text\" and strip Markdown fences and leading prose before parsing.","C":"Catch parse errors and retry the same request up to three times.","D":"Lower the temperature to 0 so the format is produced consistently."},"answer":["A"],"explanation":"Tool use with a JSON schema is the approach that guarantees schema-compliant structure and eliminates syntax errors; prompt instructions and retries only reduce the rate.","rationale":{"A":"Correct. Structured output via tool use eliminates the malformed-JSON class of failure.","B":"Still text generation; the 4% shrinks but does not vanish.","C":"Retries cost money and time and still fail some fraction of the time.","D":"Temperature affects sampling, not format guarantees."}},{"task":"4.3","domain":4,"type":"single","stem":"Three extraction tools exist, one per document type. Requirement: every request must yield a structured extraction, and the model must pick the schema that matches the document, which is not known in advance. Which tool_choice setting satisfies this?","options":{"A":"tool_choice: \"any\", so the model must call one of the tools but chooses which.","B":"tool_choice: \"auto\", so the model selects the appropriate tool.","C":"tool_choice: {\"type\": \"tool\", \"name\": \"extract_bol\"}, relying on a doc_type field in that schema to record what the document really was.","D":"tool_choice: \"none\", with the schemas described in the system prompt."},"answer":["A"],"explanation":"\"any\" guarantees a tool call while leaving the choice of tool to the model; \"auto\" permits a text reply; a forced tool removes the choice; \"none\" removes tool use.","rationale":{"A":"Correct. Guaranteed structured output, model-selected schema.","B":"\"auto\" allows the model to answer with text instead, which the requirement forbids.","C":"Forcing extract_bol on a customs declaration produces a record in the wrong schema.","D":"\"none\" prevents any tool call, so there is no structured output at all."}},{"task":"4.3","domain":4,"type":"single","stem":"Field-level review shows: HS codes are missing from about 8% of source documents; incoterms occasionally use terms outside the standard eleven; and total amounts are sometimes illegible on scans. Extractions currently fail schema validation or invent values in these cases. How should the schema be designed?","options":{"A":"Make hs_code optional; give incoterm an enum that includes \"other\" with a companion incoterm_detail string; add an \"unclear\" enum value for total_status where the amount is illegible; and state normalization rules in the prompt alongside the schema.","B":"Mark every field required and instruct the model to use an empty string when a value is missing.","C":"Make every field a free-text string so nothing can fail validation.","D":"Reject any document missing a required field and route it to the human queue."},"answer":["A"],"explanation":"Optional fields for information that may be absent, extensible enums with \"other\" plus detail, and explicit \"unclear\" values let the schema express reality instead of forcing fabrication.","rationale":{"A":"Correct. This is the schema design guidance from Task 4.3.","B":"Required-with-empty-string pushes the model to fill fields it should leave empty, which is how invented HS codes arise.","C":"Free text abandons the structure the loader depends on.","D":"8% of 40,000 documents is 3,200 a month, more than the review team can handle, for a problem the schema can represent."}},{"task":"4.4","domain":4,"type":"single","stem":"Since switching to tool-based extraction, syntax errors are gone, but 6% of invoices have line items that do not sum to the extracted total, and shipper and consignee are occasionally swapped. A team member insists \"the strict schema should have prevented this\". What is the correct response?","options":{"A":"Schemas guarantee syntax, not semantics. Add validation checks (sum, field plausibility), retry with the original document, the failed extraction and the specific errors appended, and extract calculated_total alongside stated_total so discrepancies are flagged by the model itself.","B":"Tighten the schema with regular-expression patterns on every string field so incorrect values are rejected.","C":"Switch back to JSON-in-text output, which allows the model to explain its reasoning alongside the values.","D":"Enable extended thinking for every extraction request."},"answer":["A"],"explanation":"Semantic errors survive strict schemas; they need validation and retry-with-error-feedback plus self-check fields.","rationale":{"A":"Correct. Validation, targeted retry and self-correction fields.","B":"Regex cannot know whether a sum is right or whether two valid company names are in the right fields.","C":"Reintroduces syntax errors and does not address semantics.","D":"Thinking may help marginally but provides no validation or feedback loop."}},{"task":"4.4","domain":4,"type":"single","stem":"The retry-with-error-feedback loop retries up to five times when hs_code fails validation. For one carrier the loop always exhausts its retries: the HS code appears only on a separate packing list that is not included in the request. Engineering proposes raising the limit to ten. What should the architect say?","options":{"A":"Retries cannot succeed when the information is absent from the provided source. Detect this case (for example the model reporting the field as not present) and route it to fetch the packing list or to human review instead of retrying.","B":"Raise the limit to ten and append a stronger error message on each retry.","C":"Instruct the model to infer the HS code from the goods description when it is not stated.","D":"Lower the temperature on retries so the model converges on the correct value."},"answer":["A"],"explanation":"Retries fix format and structure errors, not missing information. Inferring codes that trigger fines when wrong is the worst option available.","rationale":{"A":"Correct. Recognize the absent-information case and take a different path.","B":"Ten attempts at an impossible task cost twice as much as five.","C":"An inferred HS code is a fabricated value in a field whose errors cause fines.","D":"There is no correct value to converge on in the provided document."}},{"task":"4.4","domain":4,"type":"single","stem":"Human reviewers dismiss about 30% of the pipeline's \"HS code mismatch\" flags as not real problems, but nobody can say which kinds of flags are being dismissed or why. What should be added to the structured findings?","options":{"A":"A detected_pattern field naming the construct that triggered each flag (for example \"chapter mismatch with description\", \"code from superseded tariff\"), so dismissals can be grouped and analyzed systematically.","B":"A free-text justification from reviewers on each dismissal, collected in a spreadsheet.","C":"A model-reported confidence score, with flags below 0.6 hidden from reviewers.","D":"Nothing; remove the category since 30% of it is noise."},"answer":["A"],"explanation":"Tracking which constructs trigger findings is what makes dismissal patterns analyzable; without it the team is guessing.","rationale":{"A":"Correct. The detected_pattern field enables systematic false-positive analysis.","B":"Free text is hard to aggregate and depends on reviewer diligence.","C":"Hiding flags by an unreliable self-score removes data instead of explaining it.","D":"70% of the flags are real; the category is valuable once its noisy patterns are identified."}},{"task":"4.2","domain":4,"type":"single","stem":"On emailed invoices, quantities are often informal (\"two 40s and a reefer\", \"3 x 20ft plus one HC\"). The model regularly hallucinates a container count or type on these, and the prompt already explains the container nomenclature at length. What is the most effective improvement?","options":{"A":"Add two to four few-shot examples of correct extraction from informal and varied formats, including one where a value is absent and should be left null.","B":"Expand the nomenclature explanation with more container types and abbreviations.","C":"Raise the temperature so the model explores more interpretations before settling.","D":"Retry each emailed invoice three times and keep the most common answer."},"answer":["A"],"explanation":"Few-shot examples are the most effective technique for handling informal measurements and varied document structures, and for reducing hallucination in extraction.","rationale":{"A":"Correct. Demonstrations of the ambiguous cases, including the absent case.","B":"More instruction has already been tried; the failure is in applying it to informal text.","C":"Higher temperature increases variability; it does not reduce hallucination.","D":"Majority voting over hallucinations still yields a hallucination, at triple cost."}},{"task":"4.2","domain":4,"type":"single","stem":"To handle carrier-specific layouts, an engineer proposes adding an exhaustive list of 180 carrier-specific formatting rules to the system prompt, and later one example per carrier (300 examples). What should the architect recommend instead?","options":{"A":"A small set of targeted few-shot examples that demonstrate judgment on ambiguous cases, so the model generalizes to carriers and layouts it has not seen.","B":"The 180 rules, because explicit rules are more precise than examples.","C":"The 300 examples, so every carrier is covered exactly.","D":"A separate prompt per carrier, selected by a routing layer."},"answer":["A"],"explanation":"Few-shot examples let the model generalize judgment to novel patterns; enumerating every case is brittle and fails for the next new carrier.","rationale":{"A":"Correct. Generalization from a few well-chosen examples.","B":"180 rules fail on carrier 301 and dilute attention on every request.","C":"300 examples cost enormous context and still do not cover new layouts.","D":"Per-carrier prompts multiply maintenance and need a classifier that itself fails on new carriers."}},{"task":"4.5","domain":4,"type":"single","stem":"Three workloads are under review for the Message Batches API. W1: a customs broker uploads a document and waits on screen for the extraction. W2: a nightly re-extraction of the day's 1,500 documents for an audit report read the next morning. W3: filings that must be completed within 4 hours of vessel arrival. Which workloads should move to batch?","options":{"A":"W2 only.","B":"W2 and W3, since a 4-hour window is comfortably within batch turnaround.","C":"W1, W2 and W3, to maximize the 50% savings.","D":"None; batch is only for one-off backfills."},"answer":["A"],"explanation":"Batch has no latency SLA and may take up to 24 hours, so it fits only latency-tolerant, non-blocking work. A 4-hour hard deadline is a blocking constraint.","rationale":{"A":"Correct. The overnight audit is the only latency-tolerant workload.","B":"Batch offers no guarantee of finishing inside 4 hours; a late filing is a fine.","C":"W1 is interactive; the broker cannot wait up to a day.","D":"Recurring nightly work is a textbook batch use case."}},{"task":"4.5","domain":4,"type":"single","stem":"The team wants each batch request to call lookup_hs_code mid-extraction and then continue with the result. Separately, about 3% of items in each batch fail with malformed input. Which plan is correct?","options":{"A":"Batch requests cannot execute tools mid-request, so pre-fetch the tariff reference data into the prompt (or run the lookup outside the batch); resubmit only the failed items, identified by custom_id, after fixing their inputs; and refine the prompt on a sample set before running the full volume.","B":"Resubmit the entire batch whenever any item fails, so the results stay consistent.","C":"Set tool_choice: \"any\" in the batch requests so the tool call is forced and executed by the batch service.","D":"Use streaming responses in the batch so failures can be detected and fixed while the batch runs."},"answer":["A"],"explanation":"Batch does not support multi-turn tool execution within a request; custom_id is how failed items are isolated for resubmission; sample-set refinement raises first-pass success.","rationale":{"A":"Correct. Works within the batch constraints and resubmits only what failed.","B":"Resubmitting 100% of items to fix 3% doubles the cost.","C":"Forcing a tool call produces a tool_use block, but nothing executes it or returns the result within the batch.","D":"Batch results are collected when processing completes; there is no streaming."}},{"task":"4.6","domain":4,"type":"single","stem":"To improve quality, the extraction prompt now ends with \"After extracting, carefully double-check every field against the document and correct any mistakes.\" The measured error rate did not change. What should the architect try?","options":{"A":"Send the document and the extraction to a second, independent Claude instance with no prior reasoning context and ask it to verify each field against the source.","B":"Enable extended thinking in the extraction request so the model reasons longer before answering.","C":"Strengthen the instruction: \"You must be extremely careful; errors cause customs fines.\"","D":"Ask the same conversation to re-check its extraction two more times."},"answer":["A"],"explanation":"A model that just produced an extraction retains the reasoning that led to it and is unlikely to overturn it; an independent instance catches what self-review misses.","rationale":{"A":"Correct. Independent review without generation context.","B":"Longer reasoning within the same context still shares its blind spots.","C":"Urgency in the instruction does not change the self-review limitation.","D":"Repeated self-checks in the same session compound the same bias."}},{"task":"5.5","domain":5,"type":"single","stem":"Overall field accuracy is 97.5%, and leadership wants to auto-file everything without review. Fines keep arriving, and an analysis shows HS-code accuracy on customs declarations from one carrier group is 81%. What should the architect propose?","options":{"A":"Measure accuracy by document type and field, calibrate field-level confidence scores on a labelled validation set, and automate only segments that pass; route low-confidence extractions and ambiguous documents to human review.","B":"Automate everything, since 97.5% exceeds the 95% target set by leadership.","C":"Route a random 5% of all documents to review as a safety net.","D":"Push the overall accuracy to 99% before automating anything."},"answer":["A"],"explanation":"Aggregate accuracy masks poor segments; validate by document type and field, calibrate confidence, and automate selectively.","rationale":{"A":"Correct. Segment-level validation and confidence-based routing.","B":"The 97.5% average hides an 81% segment that is causing the fines.","C":"Uniform random sampling under-samples the problem segment and does not stop the fines.","D":"A higher aggregate can still hide a weak segment; the metric itself is the problem."}},{"task":"5.5","domain":5,"type":"single","stem":"The review team now checks only extractions with low confidence scores. A new carrier's invoices are extracted with high confidence but systematically misread the currency column, and nobody notices for a month. Which practice would have caught this?","options":{"A":"Stratified random sampling of high-confidence extractions (by document type and carrier) for ongoing error-rate measurement and detection of novel error patterns.","B":"Reviewing only low-confidence extractions, but with a lower confidence threshold.","C":"Reviewing every extraction from new carriers for their first week.","D":"Trusting the confidence scores, since they were calibrated on last year's validation set."},"answer":["A"],"explanation":"Calibrated confidence does not cover novel error patterns; stratified sampling of confident extractions is how they are detected.","rationale":{"A":"Correct. This is the Task 5.5 practice for catching what confidence cannot see.","B":"The errors were high confidence; no threshold on low confidence reaches them.","C":"Helps for new carriers but misses novel errors from existing carriers or format changes.","D":"Calibration on old data is exactly why new patterns slip through."}},{"task":"2.1","domain":2,"type":"single","stem":"A single tool, process_shipping_doc, is described as \"processes a shipping document\" and is used for three jobs: extracting fields, producing a broker-facing summary, and checking a declared value against the invoice. The agent frequently runs the wrong job. What is the best redesign?","options":{"A":"Split it into purpose-specific tools (extract_fields, summarize_for_broker, verify_declared_value), each with a defined input and output contract and a description that says when to use it.","B":"Keep one tool and add a mode parameter with an enum of the three jobs.","C":"Add few-shot examples to the system prompt showing which job to run in each situation.","D":"Force the tool with tool_choice so it is always called, and let the model set the job in the arguments."},"answer":["A"],"explanation":"Generic tools with vague descriptions cause misrouting; splitting into purpose-specific tools with contracts is the blueprint's remedy.","rationale":{"A":"Correct. Clear boundaries, one purpose per tool.","B":"The mode parameter keeps the ambiguity inside a single vague description.","C":"Few-shots compensate for a poor interface rather than fixing it.","D":"Forcing the call does nothing about choosing the wrong job."}},{"task":"2.2","domain":2,"type":"multi","select":2,"stem":"lookup_hs_code can fail for a restricted tariff chapter that requires a licensed broker (a permission rule) and for a declared value that exceeds the insured limit (a business rule). Today both come back as the plain text \"not allowed\", and the agent tells brokers to \"try again shortly\". Which TWO changes let the agent respond appropriately?","options":{"A":"Return the failure with isError set and structured fields: errorCategory (permission or business), isRetryable, and a human-readable description.","B":"Mark both cases retriable: false and include a customer-friendly explanation the agent can relay (for example, that a licensed broker must file this chapter).","C":"Return these cases as empty successful results so the agent is not alarmed.","D":"Have the tool retry permission errors with exponential backoff before returning.","E":"Use the same message for every failure so the agent's behaviour stays predictable."},"answer":["A","B"],"explanation":"Permission and business errors are non-retryable and need a category plus an explanation the agent can communicate; disguising them as success or retrying them wastes effort and misleads the broker.","rationale":{"A":"Correct. Structured error metadata with the error flag set.","B":"Correct. Non-retryable flag plus a relayable explanation.","C":"An empty success hides the reason the filing cannot proceed.","D":"A permission rule does not change on retry.","E":"Uniform messages are the cause of the \"try again shortly\" behaviour."}}]}];

// Flatten bank into ordered questions with global numbers
const QUESTIONS = [];
BANK.forEach(s => s.questions.forEach(q => QUESTIONS.push({...q, scenario:s.scenario.id, n:QUESTIONS.length+1})));

// ---------- storage ----------
const store = {
  load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||"{}"); }catch(e){ return {}; } },
  save(obj){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }catch(e){} }
};

// ---------- attempt state ----------
let state = null; // {startedAt, perm:[[keys]], answers:[[keys]], flags:[bool], cur, submittedAt, timeUsedSec}
let timerId = null;

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }
function newAttempt(){
  const seed = Date.now() % 2147483647;
  const rnd = mulberry32(seed);
  const perm = QUESTIONS.map(q => {
    const keys = Object.keys(q.options);
    for(let i=keys.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [keys[i],keys[j]]=[keys[j],keys[i]]; }
    return keys;
  });
  state = { seed, startedAt: Date.now(), perm, answers: QUESTIONS.map(()=>[]), flags: QUESTIONS.map(()=>false), cur:0, submittedAt:null };
  persistInProgress();
}
function persistInProgress(){ const s = store.load(); s.inProgress = state; store.save(s); }
function clearInProgress(){ const s = store.load(); delete s.inProgress; store.save(s); }

// ---------- scoring ----------
function isCorrect(i){
  const q = QUESTIONS[i], a = [...state.answers[i]].sort().join(""), k = [...q.answer].sort().join("");
  return a === k;
}
function score(){
  let raw = 0; const dom = {}, tasks = {};
  QUESTIONS.forEach((q,i) => {
    const ok = isCorrect(i); if(ok) raw++;
    dom[q.domain] = dom[q.domain] || {n:0,ok:0}; dom[q.domain].n++; if(ok) dom[q.domain].ok++;
    tasks[q.task] = tasks[q.task] || {n:0,ok:0}; tasks[q.task].n++; if(ok) tasks[q.task].ok++;
  });
  const scaled = Math.round(100 + 900 * raw / N);
  return { raw, scaled, pass: scaled >= PASS, dom, tasks };
}

const CODE_RE = new RegExp('(^|[^\\w./@~*"-])(' + CODE_TOKENS.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')(?=$|[^\\w./*-])', 'g');

// ---------- screens ----------
function renderStart(){
  const s = store.load();
  const hist = (s.history||[]).slice().reverse();
  const resume = s.inProgress && !s.inProgress.submittedAt;
  const bp = Object.entries(DOMAINS).map(([d,v]) => {
    const n = QUESTIONS.filter(q=>q.domain==d).length;
    return `<div class="bp-row"><span>Domain ${d} · ${esc(v.name)}</span><span class="n">${v.weight}% · ${n} items</span><span class="bar"><i style="width:${v.weight/27*100}%"></i></span></div>`;
  }).join("");
  const histRows = hist.length ? hist.map(h => `<div class="hrow"><span class="score">${h.scaled}</span><span>${h.raw}/${N} correct · <span class="${h.pass?"pf pass":"pf fail"}" style="font-size:1rem">${h.pass?"Pass":"Below cut"}</span><div class="meta">${esc(fmtDate(h.finishedAt))} · ${fmtTime(h.timeUsedSec)} used · weakest: ${esc(h.weakest||"–")}</div></span><button class="btn small" data-review="${h.id}">Review</button></div>`).join("") : `<p class="note">No attempts yet on this device.</p>`;
  $("#app").innerHTML = `
  <div class="wrap start">
    <div class="masthead">
      <span class="eyebrow">Claude Certified Architect – Foundations · practice</span>
      <h1>CCAR-F Hard Mock</h1>
      <p class="lede">Sixty original scenario items weighted to the published blueprint, timed like the real sitting. Every distractor is a technique that is right somewhere else in the guide, so read for the mechanism the scenario actually needs.</p>

      <div class="fact"><span class="v">${N}</span><span class="k">items, 4 scenarios</span></div>
      <div class="fact"><span class="v">${TOTAL_MIN}</span><span class="k">minutes, auto-submits at zero</span></div>
      <div class="fact"><span class="v">${PASS}</span><span class="k">pass mark on the 100–1000 scale</span></div>
      <div class="fact"><span class="v">${QUESTIONS.filter(q=>q.type==="multi").length}</span><span class="k">multiple-response items</span></div>
    </div>
    <div class="card section">
      <h2>Blueprint weighting</h2>
      <div class="blueprint">${bp}</div>
    </div>
    <div class="card section">
      <h2>How this mock scores</h2>
      <div class="rules"><ul>
        <li>Multiple-response items are all-or-nothing: you must select exactly the stated number and all must be correct.</li>
        <li>Scaled score is a linear map of raw correct onto 100–1000 (<code>100 + 900 × correct ⁄ 60</code>). The real exam's equating is not published; treat 720 here as roughly 42 of 60. Results also show percent correct per domain, as the real score report does.</li>
        <li>Option order is shuffled on every attempt. Flag anything you want to revisit; unanswered items count as wrong.</li>
        <li>Keyboard: <code>1</code>–<code>5</code> toggle options, <code>←</code> <code>→</code> move, <code>F</code> flags.</li>
        <li>If the page reloads mid-exam, the attempt resumes with the clock still running.</li>
      </ul></div>
    </div>
    <div class="card section">
      <h2>Attempt history</h2>
      <div class="history">${histRows}</div>
    </div>
    <div class="start-actions">
      ${resume ? `<button class="btn primary" id="resumeBtn">Resume attempt in progress</button><button class="btn danger" id="discardBtn">Discard it</button>` : `<button class="btn primary" id="startBtn">Begin exam</button>`}
      <span class="note">Scenario contexts and items are original to this mock and are not drawn from any published bank.</span>
    </div>
  </div>`;
  const sb = $("#startBtn"); if(sb) sb.onclick = () => { newAttempt(); renderExam(); };
  const rb = $("#resumeBtn"); if(rb) rb.onclick = () => { state = s.inProgress; renderExam(); };
  const db = $("#discardBtn"); if(db) db.onclick = () => { clearInProgress(); renderStart(); };
  document.querySelectorAll("[data-review]").forEach(b => b.onclick = () => {
    const h = (store.load().history||[]).find(x => x.id === b.dataset.review);
    if(h){ state = h.state; renderResults(h); }
  });
}

function renderExam(){
  $("#app").innerHTML = `
  <div class="topbar">
    <div class="in">
      <span class="title">CCAR-F Hard Mock</span>
      <span class="chip accent" id="scnChip"></span>
      <span class="grow"></span>
      <button class="btn small railtoggle" id="railToggle">Questions</button>
      <span class="timer" id="timer">${fmtTime(TOTAL_MIN*60)}</span>
    </div>
    <div class="progress"><i id="prog"></i></div>
  </div>
  <div class="wrap">
    <div class="exam">
      <div class="qcol" id="qcol"></div>
      <aside class="rail" id="rail">
        <div class="card">
          <h3>Question palette</h3>
          <div class="stats" id="stats"></div>
          <div class="pal" id="pal"></div>
          <div class="legend"><span><i class="a"></i>answered</span><span><i class="f"></i>flagged</span><span><i class="c"></i>current</span><span><i></i>not answered</span></div>
          <button class="btn primary" id="submitBtn">Submit exam</button>
          <div class="confirm hidden" id="confirm"></div>
        </div>
      </aside>
    </div>
  </div>`;
  $("#railToggle").onclick = () => $("#rail").classList.toggle("open");
  $("#submitBtn").onclick = () => showConfirm();
  renderQuestion();
  startTimer();
  document.onkeydown = onKey;
}

function showConfirm(){
  const unanswered = state.answers.filter(a => a.length===0).length;
  const flagged = state.flags.filter(Boolean).length;
  const c = $("#confirm");
  c.classList.remove("hidden");
  c.innerHTML = `<b>Submit now?</b><span>${unanswered} unanswered · ${flagged} flagged. Unanswered items score as wrong.</span><div class="row"><button class="btn primary small" id="confirmYes">Submit and score</button><button class="btn small" id="confirmNo">Keep working</button></div>`;
  $("#confirmYes").onclick = () => submit();
  $("#confirmNo").onclick = () => c.classList.add("hidden");
}

function renderQuestion(){
  const i = state.cur, q = QUESTIONS[i], sc = SCENARIOS[q.scenario];
  const first = QUESTIONS.findIndex(x => x.scenario === q.scenario) === i;
  const multi = q.type === "multi";
  const opts = state.perm[i].map((key, idx) => {
    const sel = state.answers[i].includes(key);
    return `<button class="opt ${multi?"multi":""} ${sel?"sel":""}" data-key="${key}" role="${multi?"checkbox":"radio"}" aria-checked="${sel}"><span class="key">${String.fromCharCode(65+idx)}</span><span>${fmtCode(q.options[key])}</span></button>`;
  }).join("");
  $("#qcol").innerHTML = `
    <details class="card scn" id="scn" ${first?"open":""}>
      <summary><span class="chip">Scenario ${sc.id}</span><span class="name">${esc(sc.name)}</span><span class="chip">${esc(sc.kind)}</span></summary>
      <div class="body">
        <p>${esc(sc.brief)}</p>
        <div><span class="eyebrow">Tools and components</span><ul class="tools">${sc.tools.map(t=>{ const m = t.match(/^(.*?)( → | — |: )(.*)$/); return m ? `<li><code>${esc(m[1])}</code>${esc(m[2])}${esc(m[3])}</li>` : `<li>${esc(t)}</li>`; }).join("")}</ul></div>
        <p><span class="eyebrow">Constraints</span><br>${esc(sc.constraints)}</p>
      </div>
    </details>
    <div class="card qcard">
      <div class="qhead">
        <span class="num">Question ${q.n} <span style="color:var(--muted);font-weight:500">of ${N}</span></span>
        <span class="chip ${multi?"accent":""}">${multi?`Select ${["","ONE","TWO","THREE","FOUR"][q.select]}`:"Select ONE"}</span>
        ${state.flags[i]?`<span class="chip flag">Flagged</span>`:""}
      </div>
      <p class="stem">${fmtCode(q.stem)}</p>
      <div class="opts" id="opts">${opts}</div>
      <div class="qnav">
        <div class="left">
          <button class="btn" id="prevBtn" ${i===0?"disabled":""}>← Previous</button>
          <button class="btn ${state.flags[i]?"flagged":""}" id="flagBtn">${state.flags[i]?"Unflag":"Flag for review"}</button>
        </div>
        <div class="right">
          ${multi?`<span class="note" id="multiNote"></span>`:""}
          <button class="btn primary" id="nextBtn" ${i===N-1?"disabled":""}>Next →</button>
        </div>
      </div>
    </div>`;
  $("#scnChip").textContent = `Scenario ${sc.id} · ${sc.kind}`;
  document.querySelectorAll("#opts .opt").forEach(b => b.onclick = () => toggle(b.dataset.key));
  $("#prevBtn").onclick = () => go(i-1);
  $("#nextBtn").onclick = () => go(i+1);
  $("#flagBtn").onclick = () => { state.flags[i] = !state.flags[i]; persistInProgress(); renderQuestion(); };
  updateMultiNote(); renderPalette();
  window.scrollTo({top:0});
}
function updateMultiNote(){
  const q = QUESTIONS[state.cur], el = $("#multiNote"); if(!el) return;
  const n = state.answers[state.cur].length;
  el.textContent = n === q.select ? "" : `${n} of ${q.select} selected`;
}
function toggle(key){
  const i = state.cur, q = QUESTIONS[i], a = state.answers[i];
  if(q.type === "multi"){
    if(a.includes(key)) state.answers[i] = a.filter(k=>k!==key);
    else if(a.length < q.select) state.answers[i] = [...a, key];
    else { flashNote(`Select only ${q.select}. Deselect one first.`); return; }
  } else state.answers[i] = a.includes(key) ? [] : [key];
  persistInProgress();
  document.querySelectorAll("#opts .opt").forEach(b => { const s = state.answers[i].includes(b.dataset.key); b.classList.toggle("sel", s); b.setAttribute("aria-checked", s); });
  updateMultiNote(); renderPalette();
}
function flashNote(msg){ const el=$("#multiNote"); if(!el) return; el.textContent = msg; }
function go(i){ if(i<0||i>=N) return; state.cur = i; persistInProgress(); renderQuestion(); $("#rail").classList.remove("open"); }
function renderPalette(){
  let html = "", last = null;
  QUESTIONS.forEach((q,i) => {
    if(q.scenario !== last){ html += `<span class="sep">Scenario ${q.scenario}</span>`; last = q.scenario; }
    const cls = [state.answers[i].length?"a":"", state.flags[i]?"f":"", i===state.cur?"c":""].join(" ");
    html += `<button class="${cls}" data-i="${i}" aria-label="Question ${i+1}">${i+1}</button>`;
  });
  $("#pal").innerHTML = html;
  document.querySelectorAll("#pal button").forEach(b => b.onclick = () => go(+b.dataset.i));
  const ans = state.answers.filter(a=>a.length).length, fl = state.flags.filter(Boolean).length;
  $("#stats").innerHTML = `<div><b>${ans}</b><small>answered</small></div><div><b>${N-ans}</b><small>left</small></div><div><b>${fl}</b><small>flagged</small></div>`;
  $("#prog").style.width = (ans/N*100)+"%";
}
function onKey(e){
  if(!state || state.submittedAt) return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key;
  if(k >= "1" && k <= "5"){ const key = state.perm[state.cur][+k-1]; if(key) toggle(key); }
  else if(k === "ArrowRight" || k.toLowerCase() === "n") go(state.cur+1);
  else if(k === "ArrowLeft" || k.toLowerCase() === "p") go(state.cur-1);
  else if(k.toLowerCase() === "f"){ state.flags[state.cur] = !state.flags[state.cur]; persistInProgress(); renderQuestion(); }
}
function startTimer(){
  clearInterval(timerId);
  const tick = () => {
    const left = TOTAL_MIN*60 - Math.floor((Date.now()-state.startedAt)/1000);
    const t = $("#timer"); if(!t) return;
    t.textContent = fmtTime(left);
    t.classList.toggle("low", left <= 600);
    if(left <= 0){ clearInterval(timerId); submit(true); }
  };
  tick(); timerId = setInterval(tick, 1000);
}

function submit(auto){
  clearInterval(timerId); document.onkeydown = null;
  state.submittedAt = Date.now();
  state.timeUsedSec = Math.min(TOTAL_MIN*60, Math.floor((state.submittedAt - state.startedAt)/1000));
  const r = score();
  const weakest = Object.entries(r.dom).sort((a,b)=>(a[1].ok/a[1].n)-(b[1].ok/b[1].n))[0];
  const rec = { id:String(state.submittedAt), finishedAt:state.submittedAt, raw:r.raw, scaled:r.scaled, pass:r.pass, timeUsedSec:state.timeUsedSec, weakest: weakest ? `D${weakest[0]} ${Math.round(weakest[1].ok/weakest[1].n*100)}%` : "", state, auto:!!auto };
  const s = store.load(); s.history = [...(s.history||[]), rec].slice(-20); delete s.inProgress; store.save(s);
  renderResults(rec);
}

function renderResults(rec){
  const r = score();
  const domRows = Object.entries(DOMAINS).map(([d,v]) => {
    const x = r.dom[d] || {n:0,ok:0}, pct = x.n ? Math.round(x.ok/x.n*100) : 0;
    const cls = pct < 65 ? "weak" : pct < 80 ? "mid" : "strong";
    return `<div class="drow"><span>Domain ${d} · ${esc(v.name)}</span><span class="n">${x.ok}/${x.n} · ${pct}%</span><span class="bar"><i class="${cls}" style="width:${pct}%"></i></span></div>`;
  }).join("");
  const taskRows = Object.keys(TASK_NAMES).map(t => {
    const x = r.tasks[t]; if(!x) return "";
    const miss = x.n - x.ok;
    const missedQs = QUESTIONS.filter((q,i)=>q.task===t && !isCorrect(i)).map(q=>q.n).join(", ");
    return `<tr${miss?' style="color:var(--bad)"':""}><td class="n">${t}</td><td>${esc(TASK_NAMES[t])}</td><td class="n">${x.ok}/${x.n}</td><td class="n">${missedQs||"—"}</td></tr>`;
  }).join("");
  $("#app").innerHTML = `
  <div class="wrap results">
    <div class="masthead">
      <span class="eyebrow">Score report · ${esc(fmtDate(rec.finishedAt))}${rec.auto?" · auto-submitted at time limit":""}</span>
      <h1>CCAR-F Hard Mock</h1>
    </div>
    <div class="card scorecard">
      <div class="big">${r.scaled}<small> / 1000</small></div>
      <div class="verdict">
        <span class="pf ${r.pass?"pass":"fail"}">${r.pass?"Above the 720 cut":"Below the 720 cut"}</span>
        <h2>${r.raw} of ${N} correct · ${Math.round(r.raw/N*100)}%</h2>
        <div class="row"><span class="chip">${fmtTime(rec.timeUsedSec)} used of ${TOTAL_MIN}:00</span><span class="chip">${state.flags.filter(Boolean).length} flagged</span><span class="chip">${state.answers.filter(a=>!a.length).length} unanswered</span></div>
      </div>
    </div>
    <div class="card domains">
      <h2>Percent correct by domain</h2>
      ${domRows}
      <p class="note">Bars turn amber below 80% and red below 65%. The real report shows domain percentages the same way; use them to decide where to reread the guide.</p>
    </div>
    <div class="card tasks">
      <h2>Task-statement breakdown</h2>
      <div class="tscroll"><table class="ttable"><thead><tr><th>Task</th><th>Statement</th><th>Score</th><th>Missed items</th></tr></thead><tbody>${taskRows}</tbody></table></div>
    </div>
    <div class="card section">
      <h2>Item review</h2>
      <div class="filters" id="filters">
        <button class="btn small on" data-f="all">All</button>
        <button class="btn small" data-f="wrong">Incorrect</button>
        <button class="btn small" data-f="flag">Flagged</button>
        ${Object.keys(DOMAINS).map(d=>`<button class="btn small" data-f="d${d}">D${d}</button>`).join("")}
      </div>
      <div class="rev" id="rev"></div>
    </div>
    <div class="results-actions">
      <button class="btn primary" id="againBtn">Start a new attempt</button>
      <button class="btn" id="homeBtn">Back to start</button>
    </div>
  </div>`;
  let filter = "all";
  const drawRev = () => {
    const items = QUESTIONS.filter((q,i) => filter==="all" || (filter==="wrong" && !isCorrect(i)) || (filter==="flag" && state.flags[i]) || (filter.startsWith("d") && q.domain == filter.slice(1)));
    $("#rev").innerHTML = items.length ? items.map(q => renderReviewItem(q.n-1)).join("") : `<p class="note">Nothing matches this filter.</p>`;
  };
  document.querySelectorAll("#filters .btn").forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll("#filters .btn").forEach(x=>x.classList.toggle("on", x===b)); drawRev(); });
  drawRev();
  $("#againBtn").onclick = () => { newAttempt(); renderExam(); };
  $("#homeBtn").onclick = () => renderStart();
  window.scrollTo({top:0});
}
function renderReviewItem(i){
  const q = QUESTIONS[i], ok = isCorrect(i), sc = SCENARIOS[q.scenario];
  const opts = state.perm[i].map((key, idx) => {
    const chosen = state.answers[i].includes(key), right = q.answer.includes(key);
    const cls = right && chosen ? "correct" : chosen ? "wrong" : right ? "missed" : "";
    const tag = right && chosen ? "Your answer · correct" : chosen ? "Your answer" : right ? "Correct answer" : "";
    return `<div class="ropt ${cls}"><span class="key">${String.fromCharCode(65+idx)}</span><span>${fmtCode(q.options[key])}${tag?` <span class="chip ${right?"good":"bad"}" style="margin-left:6px">${tag}</span>`:""}<span class="why">${esc(q.rationale[key])}</span></span></div>`;
  }).join("");
  return `<div class="card ritem">
    <div class="head"><span class="num">Q${q.n}</span><span class="chip ${ok?"good":"bad"}">${ok?"Correct":state.answers[i].length?"Incorrect":"Unanswered"}</span><span class="chip">D${q.domain} · Task ${q.task}</span><span class="chip">Scenario ${sc.id}</span>${state.flags[i]?`<span class="chip flag">Flagged</span>`:""}${q.type==="multi"?`<span class="chip accent">Select ${q.select}</span>`:""}</div>
    <p class="stem">${fmtCode(q.stem)}</p>
    <div class="ropts">${opts}</div>
    <div class="expl"><b>${esc(TASK_NAMES[q.task])}</b><span>${esc(q.explanation)}</span></div>
  </div>`;
}

// ---------- boot ----------
(function boot(){
  const s = store.load();
  const hash = (location.hash||"").replace("#","");
  if(hash === "resume" && s.inProgress && !s.inProgress.submittedAt){ state = s.inProgress; renderExam(); return; }
  renderStart();
})();
</script>

</body>
</html>
